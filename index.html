      },
    },
    {
      id: 'm_inaka', kind: 'magic', name: '地方最高!',
      text: '自分の場の「田舎」タグの県すべて、攻撃力が1.5倍',
      params: { atk: 1.5 },
      options(s, p, db) {
        const us = unitsWhere(s, p, db, c => c.tags.includes('田舎'));
        return us.length ? [{ label: `田舎の県 ${us.length}体の攻撃力${xLabel(this.params.atk)}`, choice: 'go' }] : '「田舎」タグの県が場にいません';
      },
      resolve(s, p, choice, db, ev) { addBuff(s, p, unitsWhere(s, p, db, c => c.tags.includes('田舎')), this.params.atk, 1, this.id, ev); },
    },
    {
      id: 'm_shinkansen', kind: 'magic', name: '新幹線開業',
      text: '自分のターンに使う。東北・北陸・九州新幹線の駅がある自分の県は、このターンもう1回攻撃できる',
      options(s, p, db) {
        if (s.active !== p) return '自分のターンに使うカードです';
        const us = unitsWhere(s, p, db, c => SHINKANSEN.includes(c.no));
        return us.length ? [{ label: `新幹線の県 ${us.length}体がもう1回攻撃できる`, choice: 'go' }] : '新幹線の駅がある県が場にいません';
      },
      resolve(s, p, choice, db, ev) {
        for (const u of unitsWhere(s, p, db, c => SHINKANSEN.includes(c.no))) {
          u.extraAttacks = (u.extraAttacks || 0) + 1;
          ev.push({ type: 'extraAttack', player: p, unitId: u.id, no: unitNo(s, u) });
        }
      },
    },
    {
      id: 'm_kokunaisen', kind: 'magic', name: '国内線需要増加',
      text: 'マジックの使用上限が、次の自分のターン開始まで2枚増える',
      params: { plus: 2 },
      options(s, p, db) {
        if (s.config.magicLimit == null) return 'マジックの使用上限がない設定なので、効果がありません';
        return [{ label: `マジックをあと${this.params.plus}枚多く使えるようにする`, choice: 'go' }];
      },
      resolve(s, p, choice, db, ev) { s.players[p].magicBonus += this.params.plus; ev.push({ type: 'magicBonus', player: p, plus: this.params.plus }); },
    },
    {
      id: 'f_typhoon', kind: 'field', name: '台風上陸',
      text: '九州・沖縄・大阪・千葉の県は、攻撃力が半分になる(両方の場)',
      mod: pref => TYPHOON.includes(pref.no) ? { atk: 0.5 } : null,
    },
    {
      id: 'f_snow', kind: 'field', name: '大雪',
      text: '「雪国」タグではない県は、攻撃力が半分になる(両方の場)',
      mod: pref => pref.tags.includes('雪国') ? null : { atk: 0.5 },
    },
    {
      id: 'f_heat', kind: 'field', name: '猛暑日',
      text: '「都心」「内陸」タグの県は、攻撃力が0.7倍になる(両方の場)',
      mod: pref => pref.tags.includes('都心') || pref.tags.includes('内陸') ? { atk: 0.7 } : null,
    },
  ];
  for (const c of SPELLS) {
    if (c.kind === 'field') c.options = function (s, p) {
      if (s.active !== p) return 'フィールドは自分のターンにだけ出せます';
      if (s.players[p].fieldUsed >= s.config.fieldPerTurn) return 'フィールドはこのターンもう出しました';
      return [{ label: s.field ? `フィールドを「${this.name}」に上書きする` : `フィールドを「${this.name}」にする`, choice: 'set' }];
    };
  }

  // 手札のマジック・フィールドが使えるか、どう使えるか
  function castInfo(s, p, handUid, db) {
    const res = { ok: false, reason: null, options: [], kind: null };
    const pl = s.players[p];
    const def = db[s.cards[handUid]];
    if (s.phase === 'over') { res.reason = '勝負はついています'; return res; }
    if (!pl.hand.includes(handUid)) { res.reason = '手札にないカードです'; return res; }
    if (!def || !def.kind || def.kind === 'pref') { res.reason = 'マジック・フィールドではありません'; return res; }
    res.kind = def.kind;
    if (def.kind === 'magic' && s.config.magicLimit != null && pl.magicUsed >= Number(s.config.magicLimit) + (pl.magicBonus || 0)) {
      res.reason = `マジックはもう使えません(${pl.magicUsed}/${Number(s.config.magicLimit) + (pl.magicBonus || 0)}枚)`;
      return res;
    }
    const o = def.options(s, p, db);
    if (typeof o === 'string') { res.reason = o; return res; }
    res.options = o;
    res.ok = o.length > 0;
    if (!res.ok) res.reason = '使えません';
    return res;
  }
  function magicLeft(s, p) {
    if (s.config.magicLimit == null) return null;
    const pl = s.players[p];
    return Math.max(0, Number(s.config.magicLimit) + (pl.magicBonus || 0) - pl.magicUsed);
  }

  function createGame(opts) {
    const cfg = mergeConfig(DEFAULT_CONFIG, opts.config);
    const first = opts.firstPlayer === 1 ? 1 : 0;
    const s = {
      v: 1, config: cfg, rng: (opts.seed >>> 0) || 1,
      turn: 1, active: first, firstPlayer: first,
      phase: 'main', winner: null, endReason: null,
      cards: {}, nextUid: 1, nextUnit: 1, players: [], field: null,
    };
    const ev = [{ type: 'gameStart', firstPlayer: first }];
    for (let i = 0; i < 2; i++) {
      // オンライン: hiddenDecks = [枚数, 枚数]。uid の並びだけ作り、中身(cards)は各自が自分の分だけ持つ。混ぜるのも各自
      if (opts.hiddenDecks) {
        const deck = Array.from({ length: opts.hiddenDecks[i] }, (_, k) => HIDDEN_PREFIX[i] + (k + 1));
        s.players.push({ life: cfg.startLife, deck, hand: [], field: [], grave: [], summonsUsed: 0, magicUsed: 0, magicBonus: 0, fieldUsed: 0, barrier: 0 });
        continue;
      }
      const deck = opts.decks[i].map(no => { const uid = 'c' + s.nextUid++; s.cards[uid] = no; return uid; });
      if (opts.shuffle !== false) shuffleInPlace(s, deck);
      s.players.push({ life: cfg.startLife, deck, hand: [], field: [], grave: [], summonsUsed: 0, magicUsed: 0, magicBonus: 0, fieldUsed: 0, barrier: 0 });
    }
    for (let i = 0; i < 2; i++) draw(s, i, cfg.startHand, ev, false);
    startTurn(s, ev);
    return { state: s, events: ev };
  }

  const handlers = {
    summon(s, a, db, ev) {
      const p = a.player;
      const info = summonInfo(s, p, a.handUid, db);
      if (!info.ok) return info.reason;
      const pl = s.players[p];
      const ids = a.tributes || [];
      if (new Set(ids).size !== ids.length) return '同じ県を2回選んでいます';
      const units = ids.map(id => findUnit(s, p, id));
      if (units.some(u => !u)) return '生け贄に選んだ県が場にいません';
      const lvs = units.map(u => db[unitNo(s, u)].level);
      if (!info.combos.some(c => sameMultiset(c, lvs))) return `生け贄の組み合わせが違います(${describeCombos(s.config.tributeTable[info.level])})`;
      for (const id of ids) destroyUnit(s, p, id, ev, 'tribute');
      pl.hand.splice(pl.hand.indexOf(a.handUid), 1);
      placeCard(s, p, a.handUid, ev, { tributes: ids.length });
      pl.summonsUsed++;
      return null;
    },
    toBattle(s, a) {
      if (s.active !== a.player) return '自分のターンではありません';
      if (s.phase !== 'main') return 'メインフェイズではありません';
      s.phase = 'battle';
      return null;
    },
    attack(s, a, db, ev) {
      const p = a.player, op = other(p);
      const att = findUnit(s, p, a.attackerId);
      if (!att) return '攻撃する県が場にいません';
      const why = canAttackReason(s, p, att);
      if (why) return why;
      const opp = s.players[op];
      if (a.targetId == null) {
        if (opp.field.length) return '相手の場に県がいる間は直接攻撃できません';
        const st = unitStats(s, att, db);
        att.attacks = (att.attacks || 0) + 1;
        ev.push({ type: 'attack', player: p, attackerId: att.id, attackerNo: st.no, direct: true, atk: st.attack });
        if (useBarrier(s, op, ev)) return null;
        damage(s, op, st.attack, ev, 'direct');
        return null;
      }
      const tgt = findUnit(s, op, a.targetId);
      if (!tgt) return '攻撃先の県が見つかりません';
      const r = resolveBattle(s, att, tgt, db);
      att.attacks = (att.attacks || 0) + 1;
      ev.push({ type: 'attack', player: p, attackerId: att.id, attackerNo: unitNo(s, att), targetId: tgt.id, targetNo: unitNo(s, tgt), direct: false, atk: r.atk, def: r.def, result: r.kind });
      if (useBarrier(s, op, ev)) return null;
      if (r.destroyTarget) destroyUnit(s, op, tgt.id, ev, 'battle');
      if (r.destroyAttacker) destroyUnit(s, p, att.id, ev, 'battle');
      if (r.damageTo === 'defender') damage(s, op, r.damage, ev, 'battle');
      if (r.damageTo === 'attacker') damage(s, p, r.damage, ev, 'reflect');
      return null;
    },
    endTurn(s, a, db, ev) {
      if (s.active !== a.player) return '自分のターンではありません';
      ev.push({ type: 'turnEnd', turn: s.turn, player: s.active });
      s.active = other(s.active);
      s.turn++;
      startTurn(s, ev);
      return null;
    },
    cast(s, a, db, ev) {
      const p = a.player;
      const info = castInfo(s, p, a.handUid, db);
      if (!info.ok) return info.reason;
      const opt = a.choice == null && info.options.length === 1 ? info.options[0] : info.options.find(o => o.choice === a.choice);
      if (!opt) return '使い方を選んでください';
      const pl = s.players[p];
      const def = db[s.cards[a.handUid]];
      pl.hand.splice(pl.hand.indexOf(a.handUid), 1);
      ev.push({ type: 'cast', player: p, id: def.id, kind: def.kind, label: opt.label });
      if (def.kind === 'field') {
        if (s.field) {
          s.players[s.field.owner].grave.push(s.field.uid);
          ev.push({ type: 'fieldGone', player: s.field.owner, id: s.cards[s.field.uid] });
        }
        s.field = { uid: a.handUid, owner: p };
        pl.fieldUsed++;
      } else {
        pl.magicUsed++;
        pl.grave.push(a.handUid);
        def.resolve(s, p, opt.choice, db, ev);
      }
      return null;
    },
    concede(s, a, db, ev) {
      endGame(s, other(a.player), 'concede', ev);
      return null;
    },
  };

  // ---------- オンライン用: 隠す情報の出し入れ ----------
  // 山札・手札の uid の並びは公開。「どの uid が何のカードか」(cards)は、場・墓地・フィールドに出たものだけ公開する
  const HIDDEN_PREFIX = ['a', 'b']; // 席0 / 席1 のカードの uid の頭文字
  function hiddenUids(s) {
    const out = new Set();
    for (const pl of s.players) for (const u of pl.hand.concat(pl.deck)) out.add(u);
    return out;
  }
  // 公開してよい形にする(相手に見せる state)
  function publicState(s) {
    const hid = hiddenUids(s);
    const o = clone(s);
    o.cards = {};
    for (const u of Object.keys(s.cards)) if (!hid.has(u) && s.cards[u] != null) o.cards[u] = s.cards[u];
    return o;
  }
  // 公開 state に自分の秘密(自分のカードの中身)を足す
  function withSecret(pub, secretCards) {
    const o = clone(pub);
    o.cards = Object.assign({}, pub.cards, secretCards || {});
    return o;
  }
  // 相手に見せるイベント(引いた札・加えた札の中身を消す)
  function publicEvents(s, ev) {
    const hid = hiddenUids(s);
    return ev.map(e => {
      const o = Object.assign({}, e);
      if (o.uid && hid.has(o.uid)) { delete o.no; delete o.id; }
      return o;
    });
  }

  // 唯一の入口。元の state は変えない
  function apply(state, action, db) {
    if (state.phase === 'over' && action.type !== 'concede') return { ok: false, state, events: [], error: '勝負はついています' };
    const h = handlers[action.type];
    if (!h) return { ok: false, state, events: [], error: `知らない操作: ${action.type}` };
    if (action.player !== 0 && action.player !== 1) return { ok: false, state, events: [], error: 'player が不正です' };
    const s = clone(state);
    const ev = [];
    const err = h(s, action, db, ev);
    if (err) return { ok: false, state, events: [], error: err };
    return { ok: true, state: s, events: ev, error: null };
  }

  return {
    DEFAULT_CONFIG, mergeConfig, makeDB, randomDeck, validateDeck,
    createGame, apply, summonInfo, describeCombos, unitStats, resolveBattle, canAttackReason, findUnit,
    SPELLS, castInfo, magicLeft, attacksAllowed, kindOf,
    HIDDEN_PREFIX, hiddenUids, publicState, withSecret, publicEvents,
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;
</script>

<!-- ===== 試遊画面(一人で両方のプレイヤーを動かす) ===== -->
<script>
(() => {
'use strict';
const PREFS = JSON.parse(document.getElementById('pref-data').textContent).prefectures;
const DB = Engine.makeDB(PREFS);
const CFG_KEY = 'pref47.config.v1';
const LOCAL_NAMES = ['プレイヤー1', 'プレイヤー2'];
let PNAME = LOCAL_NAMES;
let net = null;           // オンライン対戦中の部屋(下の「オンライン対戦」)
const online = () => screen === 'online' && !!net;
// 色の番号: オンラインでは自分を青(0)・相手を赤(1)にする
const col = p => online() ? (p === net.me ? 0 : 1) : p;
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function loadConfig() {
  try { return Engine.mergeConfig(Engine.DEFAULT_CONFIG, JSON.parse(localStorage.getItem(CFG_KEY) || 'null')); }
  catch (e) { return Engine.mergeConfig(Engine.DEFAULT_CONFIG); }
}
function saveConfig(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }

let config = loadConfig();
let state = null;
let logLines = [];
let ui = { mode: null, handUid: null, combos: [], tributes: [], attackerId: null };
let showAllHands = false; // [TEST] 両方の手札を表示
let modal = null;         // 'settings' | 'newgame' | null
let hitFx = [false, false];
let screen = 'play';      // 'play' | 'deck' | 'online'
// 盤面はローカル試遊とオンラインで別々に持ち、画面を切り替えたときに入れ替える
const slots = { play: null, online: { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] } };
function setScreen(to) {
  if (screen === 'play') slots.play = { state, logLines, deckNames, hitFx };
  screen = to;
  resetUI();
  const s = to === 'play' ? slots.play : to === 'online' ? slots.online : null;
  if (s) ({ state, logLines, deckNames, hitFx } = s);
  PNAME = to === 'online' && net ? net.names : LOCAL_NAMES;
}

// ---------- 端末に保存するもの ----------
const DECKS_KEY = 'pref47.decks.v1';
const SETUP_KEY = 'pref47.setup.v1';
function loadJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('この端末に保存できませんでした'); } }
let decks = loadJSON(DECKS_KEY, []).filter(d => d && Array.isArray(d.cards)); // [{id, name, cards:[県番号]}]
let setup = Object.assign({ decks: ['random', 'random'], first: '0' }, loadJSON(SETUP_KEY, {}));
let deckNames = ['ランダム', 'ランダム'];
const deckErrors = d => Engine.validateDeck(d.cards, DB, config);

function resolveDeck(choice, seed, p) {
  if (choice !== 'random') {
    const d = decks.find(x => x.id === choice);
    if (d && !deckErrors(d).length) return { cards: d.cards.slice(), name: d.name };
    toast(`${PNAME[p]} のデッキが使えないので、ランダムにしました`);
  }
  return { cards: Engine.randomDeck(PREFS, config, seed), name: 'ランダム' };
}

function newGame() {
  if (screen !== 'play') setScreen('play');
  const seed = (Math.random() * 2 ** 31) | 0;
  const d0 = resolveDeck(setup.decks[0], seed ^ 0x1234, 0);
  const d1 = resolveDeck(setup.decks[1], seed ^ 0x9876, 1);
  deckNames = [d0.name, d1.name];
  const first = setup.first === 'random' ? (seed & 1) : Number(setup.first) === 1 ? 1 : 0;
  const r = Engine.createGame({ config, decks: [d0.cards, d1.cards], seed, firstPlayer: first });
  state = r.state;
  logLines = [];
  hitFx = [false, false];
  resetUI();
  pushLog(r.events);
  render();
}
function resetUI() { ui = { mode: null, handUid: null, combos: [], tributes: [], attackerId: null, interrupt: null, choice: null }; }
const isSpell = id => Engine.kindOf(DB, id) !== 'pref';
const KIND_LABEL = { magic: 'マジック', field: 'フィールド' };

// マジック・フィールドを使う(選び方が複数あればダイアログ)
function castFlow(p, uid) {
  const info = Engine.castInfo(state, p, uid, DB);
  if (!info.ok) { toast(info.reason); return; }
  if (info.options.length === 1) { act({ type: 'cast', player: p, handUid: uid, choice: info.options[0].choice }); return; }
  ui.choice = { p, uid, options: info.options };
  modal = 'choice';
  render();
}
function choiceHTML() {
  const c = ui.choice;
  const def = DB[state.cards[c.uid]];
  return `<div class="modal-bg"><div class="modal">
    <h2>「${esc(def.name)}」をどう使う?</h2>
    <p class="meta">${esc(def.text)}</p>
    <div class="btns" style="display:flex;flex-direction:column;gap:8px">${c.options.map((o, i) => `<button class="primary" data-act="choose" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>
    <div class="foot"><button data-act="closeModal">やめる</button></div>
  </div></div>`;
}

function act(action) {
  if (online()) { netAct(action); return true; }
  const r = Engine.apply(state, action, DB);
  if (!r.ok) { toast(r.error); return false; }
  state = r.state;
  hitFx = [false, false];
  for (const e of r.events) if (e.type === 'damage') hitFx[e.player] = true;
  pushLog(r.events);
  resetUI();
  render();
  return true;
}

// ---------- ログ ----------
const nm = no => DB[no] ? DB[no].name : '?';
let pn = p => `<span class="p${col(p)}">${PNAME[p]}</span>`;
// lines: 書き込む先(オンラインの盤面を裏で更新するときに使う)
function pushLog(events, lines = logLines, names = PNAME, colorOf = col) {
  const savePn = pn;
  pn = p => `<span class="p${colorOf(p)}">${names[p]}</span>`;
  try { pushLogInner(events, lines); } finally { pn = savePn; }
}
function pushLogInner(events, logLines) {
  for (const e of events) {
    let t = null;
    switch (e.type) {
      case 'gameStart': t = `対戦開始。先攻は ${pn(e.firstPlayer)}`; break;
      case 'turnStart': t = `<span class="t">ターン${e.turn}</span> ${pn(e.player)} の番`; break;
      case 'draw': if (!e.setup) t = `${pn(e.player)} がドロー${e.no != null && e.mine ? `(${esc(nm(e.no))})` : ''}`; break;
      case 'deckEmpty': t = `${pn(e.player)} の山札が尽きた!`; break;
      case 'summon': t = `${pn(e.player)} が <b>${nm(e.no)}</b> を${e.special ? '特殊' : ''}召喚${e.tributes ? `(生け贄${e.tributes}枚)` : ''}`; break;
      case 'stack': t = `${pn(e.player)} が <b>${nm(e.no)}</b> を${e.special ? '特殊召喚して' : ''}重ねた → ${e.count}枚重ね${e.tributes ? `(生け贄${e.tributes}枚)` : ''}`; break;
      case 'destroyed': t = e.why === 'tribute' ? `${pn(e.player)} の ${nm(e.no)} をリリース` : e.why === 'effect' ? `${pn(e.player)} の ${nm(e.no)} を墓地に送った` : `${pn(e.player)} の ${nm(e.no)} が破壊された`; break;
      case 'cast': t = `${pn(e.player)} が${KIND_LABEL[e.kind]}「<b class="spell-name">${esc(nm(e.id))}</b>」→ ${esc(e.label)}`; break;
      case 'fieldGone': t = `フィールド「${esc(nm(e.id))}」は墓地へ`; break;
      case 'buff': t = `　${nm(e.no)} の攻撃力 ×${e.atk}${e.def !== 1 ? ` / 防御力 ×${e.def}` : ''}`; break;
      case 'search': t = e.id == null ? `　${pn(e.player)} がマジックを1枚手札に加えた` : `　${pn(e.player)} が「${esc(nm(e.id))}」を手札に加えた`; break;
      case 'barrier': t = `　${pn(e.player)} は次の攻撃を無効にできる(残り${e.count}回)`; break;
      case 'negated': t = `<b>${pn(e.player)} が攻撃を無効にした!</b>`; break;
      case 'extraAttack': t = `　${nm(e.no)} はもう1回攻撃できる`; break;
      case 'magicBonus': t = `　${pn(e.player)} のマジック上限 +${e.plus}`; break;
      case 'attack':
        t = e.direct
          ? `${pn(e.player)} の ${nm(e.attackerNo)} が直接攻撃! 攻撃力 <span class="num">${fmt(e.atk)}</span>`
          : `${pn(e.player)} の ${nm(e.attackerNo)}(攻 <span class="num">${fmt(e.atk)}</span>)→ ${nm(e.targetNo)}(防 <span class="num">${fmt(e.def)}</span>)`;
        break;
      case 'damage': t = `${pn(e.player)} に <b class="num">${fmt(e.amount)}</b> ダメージ${e.why === 'reflect' ? '(跳ね返り)' : ''} → 残り <span class="num">${fmt(e.life)}</span>`; break;
      case 'gameOver': t = `<b>勝負あり! ${pn(e.winner)} の勝ち</b>(${({ life: 'ライフ0', deckout: '山札切れ', concede: '降参', sevenCities: '七大都市そろい踏み' })[e.reason]})`; break;
    }
    if (t) logLines.push(t);
  }
}

// ---------- 描画 ----------
function cardHTML(st, extra = {}) {
  const cls = ['card', 'lv' + st.level];
  if (extra.clickable) cls.push('clickable');
  if (extra.selected) cls.push('selected');
  if (extra.dim) cls.push('dim');
  if (extra.used) cls.push('used');
  return `<div class="${cls.join(' ')}" ${extra.attrs || ''}>
    <div class="c-head"><span class="c-name">${esc(st.name)}</span><span class="c-star">${'★'.repeat(st.level)}</span></div>
    ${st.count > 1 ? `<div class="c-stack">${st.count}枚重ね ×${st.mult}</div>` : ''}
    ${st.buffAtk && (st.buffAtk !== 1 || st.buffDef !== 1) ? `<div class="c-buff">マジック 攻×${+st.buffAtk.toFixed(3)}${st.buffDef !== 1 ? ` 防×${+st.buffDef.toFixed(3)}` : ''}</div>` : ''}
    ${st.fieldAtk && (st.fieldAtk !== 1 || st.fieldDef !== 1) ? `<div class="c-fieldfx">フィールド 攻×${st.fieldAtk}${st.fieldDef !== 1 ? ` 防×${st.fieldDef}` : ''}</div>` : ''}
    <div class="c-stat atk"><b>攻撃力</b><span>${fmt(st.attack)}</span></div>
    <div class="c-stat def"><b>防御力</b><span>${fmt(st.defense)}</span></div>
    <div class="c-tags">${st.tags.map(t => `<i>${esc(t)}</i>`).join('')}</div>
    ${extra.preview || ''}
  </div>`;
}
function spellCardHTML(def, extra = {}) {
  const cls = ['card', 'spell', 'k-' + def.kind];
  if (extra.clickable) cls.push('clickable');
  if (extra.dim) cls.push('dim');
  return `<div class="${cls.join(' ')}" ${extra.attrs || ''}>
    <div class="c-head"><span class="c-name">${esc(def.name)}</span></div>
    <div class="c-kind">${KIND_LABEL[def.kind]}${def.kind === 'magic' ? '(速攻)' : ''}</div>
    <div class="c-text">${esc(def.text)}</div>
    ${extra.preview || ''}
  </div>`;
}
function anyCardHTML(id, extra) { return isSpell(id) ? spellCardHTML(DB[id], extra) : cardHTML(handCardStats(id), extra); }
function handCardStats(no) {
  const b = DB[no];
  return { no, name: b.name, level: b.level, tags: b.tags, count: 1, mult: 1, attack: b.attack, defense: Math.round(b.defense * Number(state.config.defenseScale)) };
}

function previewHTML(attUnit, tgtUnit) {
  const r = Engine.resolveBattle(state, attUnit, tgtUnit, DB);
  if (r.kind === 'win') return `<div class="preview win">破壊! 相手に ${fmt(r.damage)}</div>`;
  if (r.kind === 'lose') return `<div class="preview lose">負け${r.damage ? ` 自分に ${fmt(r.damage)}` : ''}${r.destroyAttacker ? ' 攻撃側破壊' : ''}</div>`;
  return `<div class="preview even">同じ数字: 何も起きない</div>`;
}

function sideHTML(p) {
  const pl = state.players[p];
  const mine = !online() || p === net.me; // この端末で動かせる側
  const me = state.active === p && state.phase !== 'over' && mine;
  const op = 1 - p;
  // 場
  const field = pl.field.map(u => {
    const st = Engine.unitStats(state, u, DB);
    const ex = { attrs: `data-unit="${u.id}" data-owner="${p}"` };
    if (me && ui.mode === 'tribute') { ex.clickable = true; ex.selected = ui.tributes.includes(u.id); }
    if (me && state.phase === 'battle') {
      const can = !Engine.canAttackReason(state, p, u);
      const used = (u.attacks || 0) >= Engine.attacksAllowed(u);
      ex.clickable = can; ex.dim = !can && !used; ex.used = used; ex.selected = ui.attackerId === u.id;
    }
    if (!me && ui.mode === 'attack' && state.active === op) {
      ex.clickable = true;
      ex.preview = previewHTML(Engine.findUnit(state, op, ui.attackerId), u);
    }
    return cardHTML(st, ex);
  }).join('');
  // 手札
  // オンラインでは相手の番に自分の手札のマジックをそのまま使える(割り込みボタン不要)
  const interrupting = online() ? (mine && state.active !== p && state.phase !== 'over') : (ui.interrupt === p && !me);
  const showHand = online() ? mine : (me || interrupting || showAllHands || state.phase === 'over');
  const hand = pl.hand.map(uid => {
    if (!showHand || state.cards[uid] == null) return `<div class="card back"></div>`;
    const id = state.cards[uid];
    const ex = { attrs: `data-hand="${uid}" data-owner="${p}"` };
    if (state.phase !== 'over' && isSpell(id) && (me || interrupting)) {
      const info = Engine.castInfo(state, p, uid, DB);
      ex.clickable = true; ex.dim = !info.ok;
    } else if (me && state.phase === 'main' && !isSpell(id)) {
      const info = Engine.summonInfo(state, p, uid, DB);
      ex.clickable = true; ex.dim = !info.ok; ex.selected = ui.handUid === uid;
    } else if (interrupting) ex.dim = true;
    return anyCardHTML(id, ex);
  }).join('');
  const left = Engine.magicLeft(state, p);
  const magicInfo = left == null ? 'マジック 上限なし' : `マジック 残り${left}枚`;
  const interruptBtn = !online() && !me && state.phase !== 'over'
    ? `<button class="interrupt ${interrupting ? 'on' : ''}" data-act="interrupt" data-p="${p}">${interrupting ? '割り込みをやめる' : '割り込みでマジックを使う'}</button>` : '';
  const turnMark = state.active === p && state.phase !== 'over';
  const onlineBadge = online() && !mine ? (net.presence[p] === false ? '<span class="badge off">切断中</span>' : '') : '';
  return `<section class="side p${col(p)} ${turnMark ? 'active' : ''}">
    <div class="info">
      <span class="pname">${PNAME[p]}${turnMark ? ' ◀ 手番' : ''}</span>${onlineBadge}
      <span>ライフ <span class="life num ${hitFx[p] ? 'hit' : ''}">${fmt(pl.life)}</span></span>
      ${pl.barrier ? `<span class="badge">攻撃無効 ×${pl.barrier}</span>` : ''}
      <span class="meta">デッキ「${esc(deckNames[p])}」 / 山札 ${pl.deck.length} / 墓地 ${pl.grave.length} / 召喚 ${pl.summonsUsed}/${state.config.summonsPerTurn} / ${magicInfo}</span>
      ${interruptBtn}
    </div>
    <div class="zone-label">場</div>
    <div class="zone ${pl.field.length ? '' : 'empty'}">${field}</div>
    <div class="zone-label">手札(${pl.hand.length})</div>
    <div class="zone ${pl.hand.length ? '' : 'empty'}">${hand}</div>
  </section>`;
}

function hintText() {
  if (state.phase === 'over') return '';
  if (online() && net.busy) return '送信中…';
  if (online() && state.active !== net.me) return '相手の番です。手札のマジックは割り込みで使えます';
  if (ui.mode === 'tribute') {
    const c = Engine.describeCombos(ui.combos);
    return `生け贄にする県を場から選んでください(${c})`;
  }
  if (ui.mode === 'attack') {
    const opp = state.players[1 - state.active];
    return opp.field.length ? '攻撃先の県を選んでください' : '相手の場は空。直接攻撃できます';
  }
  if (ui.interrupt != null) return `${PNAME[ui.interrupt]} の手札からマジックを選んでください`;
  if (state.phase === 'main') return '手札の県をクリックで召喚。マジックはいつでも使える';
  if (state.phase === 'battle') return '攻撃する自分の県をクリック';
  return '';
}

function fieldBoxHTML() {
  if (!state.field) return `<div class="fieldbox empty">フィールド: なし</div>`;
  const def = DB[state.cards[state.field.uid]];
  return `<div class="fieldbox"><div>フィールド: <b>${esc(def.name)}</b> <span class="p${col(state.field.owner)}">(${PNAME[state.field.owner]})</span></div><div class="meta">${esc(def.text)}</div></div>`;
}
function ctrlHTML() {
  const p = state.active;
  const over = state.phase === 'over';
  const waiting = online() && p !== net.me; // 相手の番
  let btns = '';
  if (over) {
    btns = online()
      ? `<button class="primary" data-act="netRematch">もう一度(デッキを選ぶ)</button><button data-act="netLeave">部屋を出る</button>`
      : `<button class="primary" data-act="again">もう一度(同じデッキ)</button><button data-act="new">デッキを選んで新しいゲーム</button>`;
  } else if (waiting) {
    btns = '';
  } else if (ui.mode === 'tribute') {
    const lvs = ui.tributes.map(id => DB[state.cards[Engine.findUnit(state, p, id).cards[0]]].level);
    const ok = ui.combos.some(c => c.length === lvs.length && c.slice().sort().join() === lvs.slice().sort().join());
    btns = `<button class="primary" data-act="doSummon" ${ok ? '' : 'disabled'}>この生け贄で召喚</button>
            <button data-act="cancel">やめる</button>`;
  } else if (ui.mode === 'attack') {
    const empty = !state.players[1 - p].field.length;
    btns = `${empty ? '<button class="primary" data-act="direct">直接攻撃!</button>' : ''}<button data-act="cancel">選び直す</button>`;
  } else {
    btns = `${state.phase === 'main' ? '<button data-act="toBattle">バトルフェイズへ</button>' : ''}
            <button class="primary" data-act="endTurn">ターン終了</button>`;
  }
  if (online() && net.busy) btns = btns.replace(/<button/g, '<button disabled');
  const concedeLabel = online() ? '降参する' : `${PNAME[p]} が降参`;
  return `<div class="ctrl">
    ${online() ? `<div class="meta">合言葉「${esc(net.phrase)}」${EMU ? ' <span class="test-tag" style="display:inline">エミュレータ</span>' : ''}</div>` : ''}
    <div class="turn">${over ? `${PNAME[state.winner]} の勝ち!` : `ターン${state.turn}: ${PNAME[p]}`}</div>
    <div class="phase">
      <span class="${state.phase === 'main' ? 'on' : ''}">メイン(召喚)</span>
      <span class="${state.phase === 'battle' ? 'on' : ''}">バトル</span>
    </div>
    <div class="hint">${hintText()}</div>
    <div class="btns">${btns}</div>
    ${fieldBoxHTML()}
    ${over ? '' : `<div style="margin-top:8px"><button class="danger" data-act="concede" style="width:100%;font-size:12px">${concedeLabel}</button></div>`}
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  const keep = {};
  app.querySelectorAll('[data-keep-scroll]').forEach(el => keep[el.dataset.keepScroll] = el.scrollTop);
  const bottom = online() ? net.me : 0; // 下に出すのは自分
  const inGame = screen === 'play' || (online() && net.view === 'game' && state);
  const playView = !inGame ? '' : `
    <div class="board">
      <div>
        ${sideHTML(1 - bottom)}
        ${sideHTML(bottom)}
      </div>
      <aside>
        ${ctrlHTML()}
        <div class="log" id="log">${logLines.map(l => `<div>${l}</div>`).join('')}</div>
      </aside>
    </div>`;
  app.innerHTML = `
    <header class="top">
      <h1>47都道府県カードバトル <small class="meta">試遊版</small></h1>
      <nav class="tabs">
        <button class="${screen === 'play' ? 'on' : ''}" data-act="tabPlay">対戦</button>
        <button class="${screen === 'deck' ? 'on' : ''}" data-act="tabDeck">デッキ構築</button>
        <button class="${screen === 'online' ? 'on' : ''}" data-act="tabOnline">オンライン対戦</button>
      </nav>
      ${screen === 'online' ? '' : '<button data-act="new">新しいゲーム</button>'}
      <button data-act="settings">設定</button>
      <span class="spacer"></span>
      ${screen === 'play' ? `<label class="test-tag"><input type="checkbox" data-act="showAll" ${showAllHands ? 'checked' : ''}>テスト: 両方の手札を表示</label>` : ''}
    </header>
    ${screen === 'deck' ? deckScreenHTML() : screen === 'online' && !inGame ? onlineHTML() : playView}
    ${modal === 'settings' ? settingsHTML() : ''}
    ${modal === 'newgame' ? newGameHTML() : ''}
    ${modal === 'choice' && ui.choice ? choiceHTML() : ''}
    ${inGame && state.phase === 'over' && !modal ? overHTML() : ''}`;
  const log = document.getElementById('log');
  if (log) log.scrollTop = log.scrollHeight;
  app.querySelectorAll('[data-keep-scroll]').forEach(el => { if (keep[el.dataset.keepScroll] != null) el.scrollTop = keep[el.dataset.keepScroll]; });
}

// ---------- 新しいゲーム(デッキ選択) ----------
function newGameHTML() {
  const opts = p => `<option value="random" ${setup.decks[p] === 'random' ? 'selected' : ''}>ランダム(${config.deckSize}枚)</option>` +
    decks.map(d => {
      const bad = deckErrors(d).length > 0;
      return `<option value="${d.id}" ${setup.decks[p] === d.id ? 'selected' : ''} ${bad ? 'disabled' : ''}>${esc(d.name)}${bad ? `(使えません ${d.cards.length}/${config.deckSize}枚)` : ''}</option>`;
    }).join('');
  return `<div class="modal-bg"><div class="modal">
    <h2>新しいゲーム</h2>
    <div class="set-row"><label><span style="color:var(--me)">${PNAME[0]}</span> のデッキ</label><select data-setup="0">${opts(0)}</select></div>
    <div class="set-row"><label><span style="color:var(--op)">${PNAME[1]}</span> のデッキ</label><select data-setup="1">${opts(1)}</select></div>
    <div class="set-row"><label>先攻</label><select data-setup="first">
      ${[['0', PNAME[0]], ['1', PNAME[1]], ['random', 'ランダム']].map(([v, l]) => `<option value="${v}" ${setup.first === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select></div>
    ${decks.length ? '' : '<p class="meta">デッキは「デッキ構築」で作れます。</p>'}
    <div class="foot"><button data-act="closeModal">やめる</button><button class="primary" data-act="startGame">対戦開始</button></div>
  </div></div>`;
}

// ---------- デッキ構築 ----------
const REGIONS = [['北海道', 1, 1], ['東北', 2, 7], ['関東', 8, 14], ['中部', 15, 23], ['近畿', 24, 30], ['中国', 31, 35], ['四国', 36, 39], ['九州・沖縄', 40, 47]];
const regionOf = no => (REGIONS.find(r => no >= r[1] && no <= r[2]) || ['?'])[0];
const TAGS = [...new Set(PREFS.flatMap(p => p.tags))];
let editId = null;
let filt = { q: '', kind: '', region: '', level: '', tag: '', sort: 'no' };
const SPELL_IDS = Engine.SPELLS.map(c => c.id);
const cardOrder = id => typeof id === 'number' ? id : 1000 + SPELL_IDS.indexOf(id);
const sortCards = arr => arr.sort((a, b) => cardOrder(a) - cardOrder(b));
let deleteArm = false;

const curDeck = () => decks.find(d => d.id === editId) || null;
const persistDecks = () => saveJSON(DECKS_KEY, decks);
const countIn = (d, no) => d.cards.reduce((a, x) => a + (x === no ? 1 : 0), 0);
function newDeck(cards = [], name) {
  let n = decks.length + 1;
  while (decks.some(d => d.name === `デッキ${n}`)) n++;
  const d = { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name || `デッキ${n}`, cards };
  decks.push(d);
  editId = d.id;
  persistDecks();
  return d;
}
function ensureDeck() { if (!curDeck()) { if (decks.length) editId = decks[0].id; else newDeck(); } }

function filteredCards() {
  const q = filt.q.trim();
  const prefOnly = filt.region || filt.level || filt.tag;
  const prefs = (!filt.kind || filt.kind === 'pref') ? filteredPrefs().map(p => p.no) : [];
  const spells = (!filt.kind && !prefOnly) || filt.kind === 'magic' || filt.kind === 'field'
    ? Engine.SPELLS.filter(c => (!filt.kind || c.kind === filt.kind) && (!q || c.name.includes(q))).map(c => c.id) : [];
  return prefs.concat(spells);
}
function filteredPrefs() {
  const q = filt.q.trim();
  const list = PREFS.filter(p =>
    (!q || p.name.includes(q)) &&
    (!filt.region || regionOf(p.no) === filt.region) &&
    (!filt.level || p.level === Number(filt.level)) &&
    (!filt.tag || p.tags.includes(filt.tag)));
  const key = { no: p => p.no, atk: p => -p.attack, def: p => -p.defense, level: p => -p.level * 100 + p.no }[filt.sort];
  return list.sort((a, b) => key(a) - key(b));
}
function addCard(no) {
  const d = curDeck();
  if (countIn(d, no) >= config.maxCopies) { toast(`同じ県は${config.maxCopies}枚まで`); return; }
  if (d.cards.length >= config.deckSize) { toast(`デッキは${config.deckSize}枚まで`); return; }
  d.cards.push(no); sortCards(d.cards);
  persistDecks(); render();
}
function removeCard(no) {
  const d = curDeck(); const i = d.cards.indexOf(no);
  if (i < 0) return;
  d.cards.splice(i, 1); persistDecks(); render();
}
function fillDeck() {
  const d = curDeck();
  const room = [];
  for (const id of filteredCards()) for (let i = countIn(d, id); i < config.maxCopies; i++) room.push(id);
  for (let i = room.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [room[i], room[j]] = [room[j], room[i]]; }
  const need = config.deckSize - d.cards.length;
  const add = room.slice(0, need);
  d.cards.push(...add); sortCards(d.cards);
  persistDecks(); render();
  if (add.length < need) toast(`絞り込み中のカードだけでは足りず、${add.length}枚だけ入れました(あと${need - add.length}枚)`);
}

function poolHTML() {
  const d = curDeck();
  const list = filteredCards();
  if (!list.length) return '<p class="meta">当てはまるカードがありません</p>';
  return list.map(id => {
    const n = countIn(d, id);
    const full = n >= config.maxCopies || d.cards.length >= config.deckSize;
    const foot = `<div class="pool-foot"><span class="${n ? 'in' : ''}">${isSpell(id) ? KIND_LABEL[DB[id].kind] : regionOf(id)} ${n}/${config.maxCopies}枚</span>
      <span><button class="mini" data-remove="${id}" ${n ? '' : 'disabled'}>−</button><button class="mini" data-add="${id}" ${full ? 'disabled' : ''}>＋</button></span></div>`;
    if (isSpell(id)) return spellCardHTML(DB[id], { clickable: !full, dim: full && !n, attrs: `data-add="${id}"`, preview: foot });
    const p = DB[id];
    const st = { no: p.no, name: p.name, level: p.level, tags: p.tags, count: 1, mult: 1, attack: p.attack, defense: Math.round(p.defense * Number(config.defenseScale)) };
    return cardHTML(st, { clickable: !full, dim: full && !n, attrs: `data-add="${p.no}"`, preview: foot });
  }).join('');
}

function deckScreenHTML() {
  ensureDeck();
  const d = curDeck();
  const errs = deckErrors(d);
  const lv = { 1: 0, 2: 0, 3: 0, 4: 0 };
  let atk = 0;
  let nMagic = 0, nField = 0;
  for (const id of d.cards) {
    if (isSpell(id)) { if (DB[id].kind === 'magic') nMagic++; else nField++; continue; }
    lv[DB[id].level]++; atk += DB[id].attack;
  }
  const uniq = sortCards([...new Set(d.cards)]);
  const sel = (key, label, opts) => `<select data-filter="${key}"><option value="">${label}</option>${opts.map(([v, l]) => `<option value="${v}" ${String(filt[key]) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `<div class="deckscreen">
    <section class="pool-panel">
      <div class="filters">
        <input type="search" data-filter="q" placeholder="名前でさがす" value="${esc(filt.q)}">
        ${sel('kind', '全種類', [['pref', '県'], ['magic', 'マジック'], ['field', 'フィールド']])}
        ${sel('region', '全地方', REGIONS.map(r => [r[0], r[0]]))}
        ${sel('level', '全部の星', [1, 2, 3, 4].map(n => [n, '★'.repeat(n)]))}
        ${sel('tag', '全タグ', TAGS.map(t => [t, t]))}
        <select data-filter="sort">${[['no', '県番号順'], ['atk', '攻撃力が高い順'], ['def', '防御力が高い順'], ['level', '星が多い順']].map(([v, l]) => `<option value="${v}" ${filt.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span class="meta" id="pool-count">${filteredCards().length}種類</span>
      </div>
      <div class="zone pool" id="pool">${poolHTML()}</div>
    </section>
    <aside class="deck-panel">
      <div class="row">
        <select data-deckpick style="flex:1">${decks.map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        <button data-act="deckNew">新規</button>
        <button data-act="deckDup">複製</button>
      </div>
      <div class="row"><input type="text" data-deckname value="${esc(d.name)}" maxlength="30" style="flex:1" aria-label="デッキの名前"></div>
      <div class="deck-count ${errs.length ? '' : 'done'}"><b class="num">${d.cards.length}</b> / ${config.deckSize} 枚</div>
      <div class="${errs.length ? 'err' : 'okmsg'}">${errs.length ? errs.map(esc).join('<br>') : 'このデッキで対戦できます'}</div>
      <div class="lv-bars">${[1, 2, 3, 4].map(n => `<div><span>${'★'.repeat(n)}</span><i style="width:${d.cards.length ? lv[n] / Math.max(1, config.deckSize) * 100 : 0}%" class="lvbar${n}"></i><b>${lv[n]}</b></div>`).join('')}</div>
      <div class="meta">マジック ${nMagic}枚 ・ フィールド ${nField}枚</div>
      <div class="meta">デッキの総攻撃力 <span class="num">${fmt(atk)}</span></div>
      <div class="deck-list" data-keep-scroll="decklist">
        ${uniq.length ? uniq.map(no => `<div class="dl-row ${isSpell(no) ? 'spline-' + DB[no].kind : 'lvline' + DB[no].level}">
          <span>${esc(DB[no].name)} <small>${isSpell(no) ? KIND_LABEL[DB[no].kind] : '★'.repeat(DB[no].level)}</small></span>
          <span><b>×${countIn(d, no)}</b><button class="mini" data-remove="${no}">−</button><button class="mini" data-add="${no}">＋</button></span>
        </div>`).join('') : '<p class="meta">左のカードをクリックして入れます</p>'}
      </div>
      <div class="btns">
        <button data-act="deckFill" ${d.cards.length >= config.deckSize ? 'disabled' : ''}>残りを絞り込み中のカードからランダムで埋める</button>
        <div class="row">
          <button data-act="deckClear" ${d.cards.length ? '' : 'disabled'} style="flex:1">空にする</button>
          <button class="danger" data-act="deckDelete" style="flex:1">${deleteArm ? 'もう一度押すと削除' : 'このデッキを削除'}</button>
        </div>
        <button class="primary" data-act="deckPlay" ${errs.length ? 'disabled' : ''}>このデッキで対戦する</button>
      </div>
      <p class="meta">変更はこの端末に自動で保存されます。</p>
    </aside>
  </div>`;
}

function overHTML() {
  if (overClosed) return '';
  const reason = ({ life: 'ライフが0になった', deckout: '山札が尽きた', concede: '降参', sevenCities: '負け(七大都市がそろった)' })[state.endReason];
  return `<div class="modal-bg" data-act="closeOver"><div class="modal over">
    <h2><span class="p${col(state.winner)}" style="color:var(${col(state.winner) ? '--op' : '--me'})">${PNAME[state.winner]}</span> の勝ち!</h2>
    <p class="meta" style="text-align:center">${PNAME[1 - state.winner]} の${reason}(ターン${state.turn})</p>
    <div class="foot" style="justify-content:center">${online()
      ? '<button class="primary" data-act="netRematch">もう一度(デッキを選ぶ)</button><button data-act="netLeave">部屋を出る</button>'
      : '<button class="primary" data-act="again">もう一度(同じデッキ)</button><button data-act="new">デッキを選ぶ</button>'}<button data-act="closeOverBtn">盤面を見る</button></div>
  </div></div>`;
}
let overClosed = false;

// ---------- 設定画面 ----------
const SETTINGS = [
  { h: 'ルールの数字' },
  { key: 'startLife', label: 'プレイヤーのライフ', type: 'int' },
  { key: 'magicLimit', label: 'マジックの使用上限', note: 'マジックはフェーズ4で実装。今は値の保存だけ', type: 'intOrNone' },
  { key: 'startHand', label: '最初の手札枚数', type: 'int' },
  { key: 'deckSize', label: 'デッキ枚数', type: 'int' },
  { key: 'maxCopies', label: '同名カードの上限', type: 'int' },
  { key: 'summonsPerTurn', label: '1ターンの召喚回数', type: 'int' },
  { key: 'stackMultipliers.2', label: '同じ県を2枚重ねた倍率', type: 'float' },
  { key: 'stackMultipliers.3', label: '同じ県を3枚重ねた倍率', type: 'float' },
  { key: 'stackMultipliers.4', label: '同じ県を4枚重ねた倍率', note: '設計書に無いので仮置き', type: 'float' },
  { key: 'firstPlayerDraws', label: '先攻も最初のターンにドローする', type: 'bool' },
  { h: '[未決定] 仮の動き' },
  { key: 'canAttackOnSummonTurn', label: '召喚したターンに攻撃できる', type: 'bool' },
  { key: 'reflectDamageOnLowAttack', label: '攻撃力が防御力より低いとき、差分を攻撃側が受ける', type: 'bool' },
  { key: 'attackerDestroyedOnLowAttack', label: '攻撃力が防御力より低いとき、攻撃した県も破壊される', type: 'bool' },
  { key: 'deckOutLoses', label: '山札が尽きてドローできなかったら負け', type: 'bool' },
  { h: '試遊用(設計書外)' },
  { key: 'defenseScale', label: '防御力に掛ける倍率', note: '1 = 設計書どおり。防御力が攻撃力より桁違いに小さいため、試遊で比べる用', type: 'float' },
];
const getPath = (o, k) => k.split('.').reduce((a, x) => a == null ? a : a[x], o);
function setPath(o, k, v) { const ks = k.split('.'); let t = o; for (let i = 0; i < ks.length - 1; i++) t = t[ks[i]]; t[ks[ks.length - 1]] = v; }
let settingsError = '';

function settingsHTML() {
  const rows = SETTINGS.map(s => {
    if (s.h) return `<h3>${s.h}</h3>`;
    const v = getPath(config, s.key);
    let input = '';
    if (s.type === 'bool') input = `<input type="checkbox" data-set="${s.key}" ${v ? 'checked' : ''}>`;
    else if (s.type === 'intOrNone') input = `<span class="inl"><input type="text" class="num" data-set="${s.key}" value="${v == null ? '' : v}" ${v == null ? 'disabled' : ''}><label style="white-space:nowrap"><input type="checkbox" data-none="${s.key}" ${v == null ? 'checked' : ''}>上限なし</label></span>`;
    else input = `<input type="text" class="num" data-set="${s.key}" value="${s.type === 'int' ? fmt(v) : v}">`;
    return `<div class="set-row"><label>${s.label}${s.note ? `<small>${s.note}</small>` : ''}</label>${input}</div>`;
  }).join('');
  return `<div class="modal-bg"><div class="modal">
    <h2>設定(ルール調整)</h2>
    <p class="meta">${screen === 'online'
      ? 'オンライン対戦では、部屋を作った人(ホスト)の設定が使われます。ホストが保存すると、次の対戦から反映されます。'
      : '変更は「保存して新しいゲーム」で反映されます。'}この端末に保存されます。</p>
    ${rows}
    <div class="err">${esc(settingsError)}</div>
    <div class="foot">
      <button data-act="resetCfg">初期値に戻す</button>
      <span class="spacer"></span>
      <button data-act="closeSettings">閉じる</button>
      <button class="primary" data-act="saveCfg">${screen === 'online' ? '保存' : '保存して新しいゲーム'}</button>
    </div>
  </div></div>`;
}
function readSettings() {
  const c = JSON.parse(JSON.stringify(config));
  for (const s of SETTINGS) {
    if (!s.key) continue;
    const el = document.querySelector(`[data-set="${s.key}"]`);
    if (s.type === 'bool') { setPath(c, s.key, el.checked); continue; }
    if (s.type === 'intOrNone' && document.querySelector(`[data-none="${s.key}"]`).checked) { setPath(c, s.key, null); continue; }
    const raw = el.value.replace(/[,，\s]/g, '').replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    const n = Number(raw);
    if (raw === '' || !isFinite(n)) throw new Error(`「${s.label}」が数字ではありません`);
    if (s.type !== 'float' && !Number.isInteger(n)) throw new Error(`「${s.label}」は整数で入れてください`);
    if (n < 0) throw new Error(`「${s.label}」はマイナスにできません`);
    if (!Number.isSafeInteger(Math.round(n)) && s.type === 'int') throw new Error(`「${s.label}」が大きすぎます(9,007,199,254,740,991 まで)`);
    setPath(c, s.key, n);
  }
  if (c.startLife <= 0) throw new Error('ライフは1以上にしてください');
  if (c.deckSize < 1) throw new Error('デッキは1枚以上にしてください');
  if (c.maxCopies < 1) throw new Error('同名カードの上限は1以上にしてください');
  if (c.deckSize > PREFS.length * c.maxCopies) throw new Error(`デッキ${c.deckSize}枚は作れません(47県 × 同名${c.maxCopies}枚 = ${PREFS.length * c.maxCopies}枚まで)`);
  return c;
}

// ---------- 入力 ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-hand],[data-unit],[data-add],[data-remove]');
  if (!t) return;
  const a = t.dataset.act;
  if (a !== 'deckDelete' && deleteArm) { deleteArm = false; if (!a && !t.dataset.add && !t.dataset.remove) render(); }
  const cid = v => /^\d+$/.test(v) ? Number(v) : v;
  if (t.dataset.add) { if (!t.disabled) addCard(cid(t.dataset.add)); return; }
  if (t.dataset.remove) { removeCard(cid(t.dataset.remove)); return; }
  if (a) {
    if (a === 'showAll') { showAllHands = t.checked; render(); return; } // [TEST]
    if (a === 'closeOver' && e.target !== t) return;
    switch (a) {
      case 'new': modal = 'newgame'; render(); return;
      case 'again': overClosed = false; modal = null; newGame(); return;
      case 'startGame':
        saveJSON(SETUP_KEY, setup); overClosed = false; modal = null; newGame(); return;
      case 'closeModal': modal = null; if (ui.choice) ui.choice = null; render(); return;
      case 'choose': {
        const c = ui.choice; const o = c && c.options[Number(t.dataset.i)];
        modal = null;
        if (o) act({ type: 'cast', player: c.p, handUid: c.uid, choice: o.choice });
        return;
      }
      case 'interrupt': {
        const q = Number(t.dataset.p);
        const on = ui.interrupt === q;
        resetUI(); ui.interrupt = on ? null : q; render(); return;
      }
      case 'tabPlay': if (!slots.play && screen !== 'play') { newGame(); } else setScreen('play'); render(); window.scrollTo(0, 0); return;
      case 'tabDeck': setScreen('deck'); render(); window.scrollTo(0, 0); return;
      case 'tabOnline': setScreen('online'); render(); window.scrollTo(0, 0); return;
      case 'netEnter': netEnter(); return;
      case 'netReady': netReady(); return;
      case 'netUnready': netUnready(); return;
      case 'netLeave': netLeave(); return;
      case 'netRematch': net.view = 'room'; overClosed = false; render(); return;
      case 'netToGame': net.view = 'game'; render(); return;
      case 'deckNew': newDeck(); render(); return;
      case 'deckDup': { const d = curDeck(); newDeck(d.cards.slice(), `${d.name}のコピー`); render(); return; }
      case 'deckClear': curDeck().cards = []; persistDecks(); render(); return;
      case 'deckFill': fillDeck(); return;
      case 'deckDelete':
        if (!deleteArm) { deleteArm = true; render(); return; }
        deleteArm = false;
        decks = decks.filter(d => d.id !== editId);
        setup.decks = setup.decks.map(x => x === editId ? 'random' : x); saveJSON(SETUP_KEY, setup);
        editId = null; persistDecks(); render(); toast('デッキを削除しました'); return;
      case 'deckPlay':
        setup.decks[0] = editId; modal = 'newgame'; render(); return;
      case 'settings': settingsError = ''; modal = 'settings'; render(); return;
      case 'closeSettings': modal = null; render(); return;
      case 'resetCfg': config = Engine.mergeConfig(Engine.DEFAULT_CONFIG); settingsError = ''; render(); return;
      case 'saveCfg':
        try {
          config = readSettings(); saveConfig(config); modal = null;
          if (screen === 'online') { netPushConfig(); render(); return; } // 部屋のルールに反映(ホストのみ)
          overClosed = false; newGame();
        }
        catch (err) { settingsError = err.message; render(); }
        return;
      case 'closeOver': case 'closeOverBtn': overClosed = true; render(); return;
      case 'cancel': resetUI(); render(); return;
      case 'toBattle': act({ type: 'toBattle', player: state.active }); return;
      case 'endTurn': act({ type: 'endTurn', player: state.active }); return;
      case 'concede':
        if (online()) {
          if (!net.concedeArm) { net.concedeArm = true; toast('もう一度押すと降参します'); setTimeout(() => { if (net) net.concedeArm = false; }, 3000); return; }
          net.concedeArm = false; act({ type: 'concede', player: net.me }); return;
        }
        act({ type: 'concede', player: state.active }); return;
      case 'direct': act({ type: 'attack', player: state.active, attackerId: ui.attackerId, targetId: null }); return;
      case 'doSummon': act({ type: 'summon', player: state.active, handUid: ui.handUid, tributes: ui.tributes }); return;
    }
    return;
  }
  if (!state || state.phase === 'over') return;
  if (screen === 'deck') return;
  const p = state.active;
  if (online() && net.busy) return;
  if (t.dataset.hand) {
    const owner = Number(t.dataset.owner);
    const uid = t.dataset.hand;
    if (online() && owner !== net.me) return;
    if (isSpell(state.cards[uid])) {
      if (owner === p || ui.interrupt === owner || online()) castFlow(owner, uid);
      return;
    }
    if (owner !== p || state.phase !== 'main') return;
    const info = Engine.summonInfo(state, p, uid, DB);
    if (!info.ok) { toast(info.reason); return; }
    if (info.combos.some(c => c.length === 0)) { act({ type: 'summon', player: p, handUid: uid, tributes: [] }); return; }
    ui = { mode: 'tribute', handUid: uid, combos: info.combos, tributes: [], attackerId: null };
    render();
    return;
  }
  if (t.dataset.unit) {
    const owner = Number(t.dataset.owner), id = t.dataset.unit;
    if (online() && p !== net.me) return;
    if (owner === p && ui.mode === 'tribute') {
      ui.tributes = ui.tributes.includes(id) ? ui.tributes.filter(x => x !== id) : [...ui.tributes, id];
      render();
      return;
    }
    if (owner === p && state.phase === 'battle') {
      const why = Engine.canAttackReason(state, p, Engine.findUnit(state, p, id));
      if (why) { toast(why); return; }
      ui = { mode: 'attack', handUid: null, combos: [], tributes: [], attackerId: id };
      render();
      return;
    }
    if (owner !== p && ui.mode === 'attack') {
      act({ type: 'attack', player: p, attackerId: ui.attackerId, targetId: id });
    }
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.none;
  if (k) { const el = document.querySelector(`[data-set="${k}"]`); el.disabled = e.target.checked; if (!e.target.checked && !el.value) el.value = '2'; }
  const ds = e.target.dataset || {};
  if (ds.setup != null) { if (ds.setup === 'first') setup.first = e.target.value; else setup.decks[Number(ds.setup)] = e.target.value; }
  if (ds.netdeck != null) { setup.online = e.target.value; saveJSON(SETUP_KEY, setup); render(); }
  if (ds.filter && ds.filter !== 'q') { filt[ds.filter] = e.target.value; render(); }
  if (ds.deckpick != null) { editId = e.target.value; deleteArm = false; render(); }
});
document.addEventListener('input', e => {
  const ds = e.target.dataset || {};
  if (ds.filter === 'q') { // 入力中は一覧だけ描き直す(入力欄のフォーカスを保つ)
    filt.q = e.target.value;
    document.getElementById('pool').innerHTML = poolHTML();
    document.getElementById('pool-count').textContent = `${filteredCards().length}種類`;
  }
  if (ds.phrase != null) netPhrase = e.target.value;
  if (ds.deckname != null) {
    const d = curDeck(); if (!d) return;
    d.name = e.target.value.trim() || '名前なし';
    persistDecks();
    const opt = document.querySelector(`[data-deckpick] option[value="${d.id}"]`);
    if (opt) opt.textContent = d.name;
  }
});

// ========== オンライン対戦(フェーズ5) ==========
// 部屋の鍵 = 合言葉の SHA-256。公開の盤面は rooms/{鍵}/pub、
// 自分のカードの中身(uid → カード)は secrets/{鍵}/{自分のuid} に置き、Security Rules で本人しか読めない
const EMU = new URLSearchParams(location.search).has('emu'); // [TEST] ローカルの Firebase エミュレータにつなぐ
const FIREBASE_CONFIG = null; // 本番の Firebase の設定(まだ作っていない)
const FB_VER = '10.12.2';
const NET_KEY = 'pref47.net.v1';    // sessionStorage: 再読み込みで同じ部屋に戻る
const STALE_MS = 6 * 3600 * 1000;   // これより古い部屋は、同じ合言葉で作り直せる
const RECENT_MAX = 40;              // 盤面と一緒に送る直近のログ
let fb = null, fbLoading = null;
let netPhrase = '';
let netMsg = '';
let netEntering = false;

const cryptoInt = () => crypto.getRandomValues(new Uint32Array(1))[0] | 0;
function cryptoShuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function fbInit() {
  if (fb) return Promise.resolve(fb);
  if (fbLoading) return fbLoading;
  fbLoading = (async () => {
    const cfg = EMU
      ? { apiKey: 'demo-key', projectId: 'demo-pref47', databaseURL: 'http://127.0.0.1:9000?ns=demo-pref47-default-rtdb' } // [TEST]
      : FIREBASE_CONFIG;
    if (!cfg) throw new Error('オンライン対戦はまだ準備中です(サーバー未設定)');
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A, U, D] = await Promise.all(['app', 'auth', 'database'].map(n => import(base + `firebase-${n}.js`)));
    const app = A.initializeApp(cfg);
    const auth = U.getAuth(app);
    if (EMU) U.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true }); // [TEST]
    const db = D.getDatabase(app);
    if (EMU) D.connectDatabaseEmulator(db, '127.0.0.1', 9000); // [TEST]
    await U.setPersistence(auth, U.browserSessionPersistence); // タブごとに別の人(再読み込みでは同じ人のまま)
    await auth.authStateReady();
    if (!auth.currentUser) await U.signInAnonymously(auth);
    fb = { D, db, uid: auth.currentUser.uid, ref: p => D.ref(db, p) };
    return fb;
  })();
  fbLoading.catch(() => { fbLoading = null; });
  return fbLoading;
}

async function roomKey(phrase) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pref47:' + phrase.toLowerCase()));
  return [...new Uint8Array(buf)].slice(0, 10).map(b => b.toString(16).padStart(2, '0')).join('');
}
const normPhrase = t => String(t || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
const roomPath = sub => `rooms/${net.key}${sub ? '/' + sub : ''}`;
const roomConfig = () => Engine.mergeConfig(Engine.DEFAULT_CONFIG, net && net.meta && net.meta.config ? JSON.parse(net.meta.config) : config);
const nextGameNo = () => (net.pub ? net.pub.game : 0) + 1;
const isHost = () => net && net.seat === 0;

// 合言葉で入る: 部屋がなければ作る(ホスト)、1人いれば入る(ゲスト)、自分の部屋なら戻る
async function netEnter(phraseArg) {
  const phrase = normPhrase(phraseArg != null ? phraseArg : netPhrase);
  if (!phrase) { netMsg = '合言葉を入れてください'; render(); return; }
  if (phrase.length > 30) { netMsg = '合言葉は30文字までにしてください'; render(); return; }
  if (netEntering) return;
  netEntering = true; netMsg = 'つないでいます…'; render();
  try {
    const f = await fbInit();
    const D = f.D;
    const key = await roomKey(phrase);
    let seat = null;
    for (let tries = 0; tries < 2 && seat == null; tries++) {
      const meta = (await D.get(f.ref(`rooms/${key}/meta`))).val();
      try {
        if (!meta || !(meta.created > Date.now() - STALE_MS)) {
          await D.set(f.ref(`rooms/${key}`), { meta: { host: f.uid, created: D.serverTimestamp(), config: JSON.stringify(config) } });
          seat = 0;
        } else if (meta.host === f.uid) seat = 0;
        else if (meta.guest === f.uid) seat = 1;
        else if (!meta.guest) { await D.set(f.ref(`rooms/${key}/meta/guest`), f.uid); seat = 1; }
        else throw new Error('この合言葉の部屋は満員です。別の合言葉にしてください');
      } catch (e) {
        if (tries || /満員/.test(e.message)) throw /permission/i.test(e.message) ? new Error('この合言葉の部屋には入れませんでした(満員か、作り直し中です)') : e;
      }
    }
    try { sessionStorage.setItem(NET_KEY, JSON.stringify({ phrase })); } catch (e) {}
    netOpen(phrase, key, seat);
    netMsg = '';
  } catch (e) {
    netMsg = e.message || String(e);
  }
  netEntering = false;
  render();
}

function netOpen(phrase, key, seat) {
  netClose();
  const f = fb, D = f.D;
  net = {
    phrase, key, seat, me: seat,
    names: seat === 0 ? ['あなた', '相手'] : ['相手', 'あなた'],
    meta: null, ready: {}, pub: null, presence: {}, secret: null,
    view: 'room', busy: false, starting: false, lastVer: 0, game: 0, unsub: [], concedeArm: false,
  };
  slots.online = { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] };
  if (screen === 'online') setScreen('online');
  const mine = net;
  const on = (sub, fn) => net.unsub.push(D.onValue(f.ref(roomPath(sub)),
    s => { if (net === mine) fn(s.val()); },
    err => { if (net === mine) { netMsg = '部屋の情報を読めませんでした: ' + err.message; render(); } }));
  on('meta', v => {
    if (!v || (v.host !== f.uid && v.guest !== f.uid)) { netKicked(v ? '部屋から外れました' : '部屋がなくなりました(ホストが部屋を出ました)'); return; }
    net.meta = v;
    render();
  });
  on('ready', v => { net.ready = v || {}; netMaybeStart(); render(); });
  on('presence', v => { net.presence = v || {}; render(); });
  on('pub', v => { netOnPub(v); });
  // 接続中かどうか(切れたら false)
  const pres = f.ref(roomPath('presence/' + seat));
  net.presRef = pres;
  net.unsub.push(D.onValue(f.ref('.info/connected'), s => {
    if (s.val() === true && net === mine) { D.onDisconnect(pres).set(false).catch(() => {}); D.set(pres, true).catch(() => {}); }
  }));
}

function netClose() {
  if (!net) return;
  for (const u of net.unsub) { try { u(); } catch (e) {} }
  if (net.presRef) { fb.D.onDisconnect(net.presRef).cancel().catch(() => {}); }
  net = null;
  if (screen === 'online') PNAME = LOCAL_NAMES;
}
function netKicked(msg) {
  netClose();
  try { sessionStorage.removeItem(NET_KEY); } catch (e) {}
  slots.online = { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] };
  if (screen === 'online') setScreen('online');
  netMsg = msg;
  modal = null;
  render();
}

async function netLeave() {
  if (!net) return;
  const n = net, f = fb, D = f.D;
  if (n.pub && slots.online.state && slots.online.state.phase !== 'over' && n.secret && n.secret.game === n.pub.game) {
    await netAct({ type: 'concede', player: n.me }); // 対戦中に出たら降参
  }
  netClose();
  try { sessionStorage.removeItem(NET_KEY); } catch (e) {}
  try {
    await D.remove(f.ref(`secrets/${n.key}/${f.uid}`));
    if (n.seat === 0) await D.remove(f.ref(`rooms/${n.key}`));
    else {
      await D.remove(f.ref(`rooms/${n.key}/ready/1`));
      await D.remove(f.ref(`rooms/${n.key}/presence/1`));
      await D.remove(f.ref(`rooms/${n.key}/meta/guest`));
    }
  } catch (e) {}
  slots.online = { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] };
  if (screen === 'online') setScreen('online');
  netMsg = '部屋を出ました';
  overClosed = false;
  render();
}

// 自分のデッキを混ぜて秘密の場所に置き、準備OKを出す
async function netReady() {
  if (!net || !net.meta) return;
  const cfgR = roomConfig();
  const choice = setup.online || 'random';
  let cards, name;
  if (choice === 'random') { cards = Engine.randomDeck(PREFS, cfgR, cryptoInt()); name = 'ランダム'; }
  else {
    const d = decks.find(x => x.id === choice);
    if (!d) { toast('デッキが見つかりません'); return; }
    const errs = Engine.validateDeck(d.cards, DB, cfgR);
    if (errs.length) { toast('この部屋のルールでは使えません: ' + errs[0]); return; }
    cards = d.cards.slice(); name = d.name;
  }
  cryptoShuffle(cards);
  const game = nextGameNo();
  const pre = Engine.HIDDEN_PREFIX[net.me];
  const map = {};
  cards.forEach((no, i) => { map[pre + (i + 1)] = no; });
  const f = fb, D = f.D;
  try {
    await D.set(f.ref(`secrets/${net.key}/${f.uid}`), { game, cards: JSON.stringify(map) });
    await D.set(f.ref(roomPath('ready/' + net.seat)), { game, deckSize: cards.length, deckName: name.slice(0, 40) });
    net.myDeckName = name;
  } catch (e) { toast('準備OKを送れませんでした: ' + e.message); }
}
async function netUnready() {
  if (!net) return;
  try { await fb.D.remove(fb.ref(roomPath('ready/' + net.seat))); } catch (e) { toast(e.message); }
}
// ホストが設定を変えたら部屋のルールを書き換え、両者の準備OKを取り消す
async function netPushConfig() {
  if (!net) return;
  if (!isHost()) { toast('部屋のルールはホストの設定が使われます'); return; }
  const D = fb.D;
  try {
    await D.set(fb.ref(roomPath('meta/config')), JSON.stringify(config));
    await D.remove(fb.ref(roomPath('ready')));
    toast('部屋のルールを変えました。準備OKを押し直してください');
  } catch (e) { toast('ルールを送れませんでした: ' + e.message); }
}

// 両者が準備OKなら、ホストが対戦を始める(盤面は uid の並びだけ。中身は各自の秘密)
async function netMaybeStart() {
  if (!isHost() || net.starting || !net.meta) return;
  const g = nextGameNo();
  const r0 = net.ready[0], r1 = net.ready[1];
  if (!r0 || !r1 || r0.game !== g || r1.game !== g) return;
  const cfgR = roomConfig();
  if (r0.deckSize !== cfgR.deckSize || r1.deckSize !== cfgR.deckSize) return;
  net.starting = true;
  const n = net;
  try {
    const c = Engine.createGame({ config: cfgR, hiddenDecks: [r0.deckSize, r1.deckSize], seed: cryptoInt(), firstPlayer: cryptoInt() & 1 });
    const json = JSON.stringify({ state: Engine.publicState(c.state), recent: [{ ver: 1, by: 0, ev: Engine.publicEvents(c.state, c.events) }] });
    await fb.D.runTransaction(fb.ref(roomPath('pub')), cur => {
      if (cur && cur.game >= g) return; // もう始まっている
      return { game: g, ver: 1, json };
    }, { applyLocally: false });
  } catch (e) { netMsg = '対戦を始められませんでした: ' + e.message; render(); }
  n.starting = false;
}

// 公開の盤面が届いた: 自分の秘密と合わせて表示用の state を作る
async function netOnPub(v) {
  const n = net;
  n.pub = v;
  if (!v) { render(); return; }
  if (!n.secret || n.secret.game !== v.game) {
    let s = null;
    try { s = (await fb.D.get(fb.ref(`secrets/${n.key}/${fb.uid}`))).val(); } catch (e) {}
    if (net !== n || n.pub !== v) return; // 待っている間に次が届いた
    if (!s || s.game !== v.game) { netMsg = '自分のデッキの情報が見つかりません(この対戦には参加していません)'; render(); return; }
    n.secret = { game: s.game, cards: JSON.parse(s.cards) };
  }
  const data = JSON.parse(v.json);
  const slot = slots.online;
  if (n.game !== v.game) {
    n.game = v.game; n.lastVer = 0;
    slot.logLines = [];
    n.view = 'game';
    overClosed = false;
    const r = n.ready || {};
    slot.deckNames = [0, 1].map(p => p === n.me ? ((r[p] && r[p].deckName) || n.myDeckName || '') : '(非公開)');
  }
  const fresh = data.recent.filter(r => r.ver > n.lastVer);
  slot.hitFx = [false, false];
  let fromOpp = false;
  for (const r of fresh) {
    if (r.by !== n.me) fromOpp = true;
    // 自分が引いた札・加えた札は、自分のログにだけ名前を出す
    const ev = r.ev.map(e => {
      if (e.player !== n.me || !e.uid || n.secret.cards[e.uid] == null) return e;
      if (e.type === 'draw') return Object.assign({}, e, { no: n.secret.cards[e.uid], mine: true });
      if (e.type === 'search') return Object.assign({}, e, { id: n.secret.cards[e.uid] });
      return e;
    });
    pushLog(ev, slot.logLines, n.names, p => p === n.me ? 0 : 1);
    if (n.lastVer) for (const e of ev) if (e.type === 'damage') slot.hitFx[e.player] = true;
  }
  n.lastVer = v.ver;
  slot.state = Engine.withSecret(data.state, n.secret.cards);
  if (screen === 'online') {
    ({ state, logLines, deckNames, hitFx } = slot);
    if (fromOpp && ui.mode) resetUI(); // 相手の割り込みで盤面が変わったら選び直し
    if (fromOpp && modal === 'choice') { modal = null; ui.choice = null; }
  }
  render();
}

// 操作を送る。盤面の更新は transaction で1つずつ(割り込みとぶつかったらやり直し)
async function netAct(action) {
  const n = net;
  if (!n || n.busy || !n.secret) return;
  n.busy = true; resetUI(); render();
  let err = null;
  try {
    await fb.D.runTransaction(fb.ref(`rooms/${n.key}/pub`), cur => {
      err = null;
      if (cur == null) return cur;
      if (cur.game !== n.secret.game) { err = '別の対戦が始まっています'; return; }
      const data = JSON.parse(cur.json);
      const r = Engine.apply(Engine.withSecret(data.state, n.secret.cards), action, DB);
      if (!r.ok) { err = r.error; return; }
      const ver = cur.ver + 1;
      const recent = data.recent.concat([{ ver, by: n.me, ev: Engine.publicEvents(r.state, r.events) }]).slice(-RECENT_MAX);
      return { game: cur.game, ver, json: JSON.stringify({ state: Engine.publicState(r.state), recent }) };
    }, { applyLocally: false });
    if (err) toast(err);
  } catch (e) { toast('送信できませんでした: ' + e.message); }
  n.busy = false;
  render();
}

function onlineHTML() {
  const noServer = !EMU && !FIREBASE_CONFIG;
  if (!net) {
    return `<div class="online">
      <h2>オンライン対戦</h2>
      <p class="meta">相手と同じ合言葉を入れると、同じ部屋に入れます。先に入った人がホストで、ホストの設定(ルール)で対戦します。</p>
      ${noServer ? '<p class="err">オンライン対戦はまだ準備中です(サーバー未設定)。</p>' : ''}
      <div class="row"><input type="text" data-phrase maxlength="30" placeholder="合言葉(例: うどん県)" value="${esc(netPhrase)}" ${noServer ? 'disabled' : ''}>
      <button class="primary" data-act="netEnter" ${netEntering || noServer ? 'disabled' : ''}>入る</button></div>
      <div class="${/出ました/.test(netMsg) || /つないで/.test(netMsg) ? 'meta' : 'err'}" style="margin-top:8px">${esc(netMsg)}</div>
      ${EMU ? '<p class="test-tag" style="margin-top:12px">開発用: ローカルの Firebase エミュレータにつないでいます</p>' : ''}
    </div>`;
  }
  const cfgR = roomConfig();
  const g = nextGameNo();
  const opp = 1 - net.me;
  const joined = [!!(net.meta && net.meta.host), !!(net.meta && net.meta.guest)];
  const rdy = p => { const r = net.ready[p]; return !!(r && r.game === g); };
  const status = p => !joined[p] ? '<span class="meta">まだ来ていません</span>'
    : net.presence[p] === false ? '<span class="badge off">切断中</span>'
    : rdy(p) ? '<span class="badge">準備OK</span>' : '<span class="meta">デッキを選んでいます</span>';
  const myReady = rdy(net.me);
  const choice = setup.online || 'random';
  const deckOpts = `<option value="random" ${choice === 'random' ? 'selected' : ''}>ランダム(${cfgR.deckSize}枚)</option>` + decks.map(d => {
    const bad = Engine.validateDeck(d.cards, DB, cfgR).length > 0;
    return `<option value="${d.id}" ${choice === d.id ? 'selected' : ''} ${bad ? 'disabled' : ''}>${esc(d.name)}${bad ? `(使えません ${d.cards.length}/${cfgR.deckSize}枚)` : ''}</option>`;
  }).join('');
  const lastOver = net.pub && slots.online.state && slots.online.state.phase === 'over';
  const playing = net.pub && slots.online.state && slots.online.state.phase !== 'over';
  const rule = (k, v) => `<div><span class="meta">${k}</span> <b class="num">${v}</b></div>`;
  return `<div class="online">
    <h2>部屋「${esc(net.phrase)}」</h2>
    <p class="meta">相手に同じ合言葉を伝えてください。${EMU ? '<span class="test-tag" style="display:inline">エミュレータ</span>' : ''}</p>
    <div class="seats">
      <div class="seat p0"><b>あなた</b>(${net.seat === 0 ? 'ホスト' : 'ゲスト'}) ${status(net.me)}</div>
      <div class="seat p1"><b>相手</b>(${net.seat === 0 ? 'ゲスト' : 'ホスト'}) ${status(opp)}</div>
    </div>
    <h3>ルール(ホストの設定)</h3>
    <div class="rules">
      ${rule('ライフ', fmt(cfgR.startLife))}${rule('デッキ', cfgR.deckSize + '枚')}${rule('同名', cfgR.maxCopies + '枚まで')}
      ${rule('最初の手札', cfgR.startHand + '枚')}${rule('マジック', cfgR.magicLimit == null ? '上限なし' : `1ターン${cfgR.magicLimit}枚`)}${rule('召喚', `1ターン${cfgR.summonsPerTurn}回`)}
    </div>
    ${isHost() ? '<p class="meta">ルールは上の「設定」から変えられます。</p>' : ''}
    ${playing ? `<div class="btns" style="margin-top:12px"><button class="primary" data-act="netToGame">対戦に戻る</button></div>` : `
    <h3>デッキ</h3>
    <div class="row"><select data-netdeck ${myReady ? 'disabled' : ''}>${deckOpts}</select>
      ${myReady ? '<button data-act="netUnready">準備をやめる</button>' : `<button class="primary" data-act="netReady" ${joined[opp] ? '' : ''}>このデッキで準備OK</button>`}</div>
    <p class="meta">${myReady ? (rdy(opp) ? '対戦を始めています…' : '相手の準備を待っています') : '両方が準備OKになると対戦が始まります。先攻はランダムです。'}</p>`}
    ${lastOver ? '<div style="margin-top:8px"><button data-act="netToGame">前の対戦の盤面を見る</button></div>' : ''}
    <div class="err">${esc(netMsg)}</div>
    <div class="foot"><button class="danger" data-act="netLeave">部屋を出る</button></div>
  </div>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.phrase != null) { netPhrase = e.target.value; netEnter(); }
});

let toastTimer = null;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2200);
}

newGame();
// 再読み込みしたら、さっきの部屋に戻る
try {
  const saved = JSON.parse(sessionStorage.getItem(NET_KEY) || 'null');
  if (saved && saved.phrase) { setScreen('online'); netPhrase = saved.phrase; render(); netEnter(saved.phrase); }
} catch (e) {}
window.__game ={ get state() { return state; }, act, DB, Engine }; // [TEST] コンソールから触る用
})();
