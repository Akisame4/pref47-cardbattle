<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>47都道府県カードバトル</title>
<style>
:root{
  --bg:#13161d; --panel:#1c2029; --panel2:#252a36; --line:#363d4d;
  --text:#eef0f4; --sub:#9aa3b5; --dim:#6b7385;
  --accent:#ffcc33; --me:#5ab0ff; --op:#ff6b6b; --ok:#6fd38a; --warn:#ffb347;
  --lv1:#7d8899; --lv2:#4f9d69; --lv3:#3f7fd1; --lv4:#d4a017;
  --num:"Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:14px}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
button.danger{background:#5a2323;border-color:#8a3a3a}
input,select{font:inherit;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.num{font-family:var(--num);letter-spacing:.02em}
.wrap{max-width:1400px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:18px;margin:0 12px 0 0}
.spacer{flex:1}
.test-tag{font-size:11px;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:4px 8px;display:flex;gap:6px;align-items:center}

.board{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.side{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.side.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.side .info{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.side .pname{font-weight:800;font-size:16px}
.side.p0 .pname{color:var(--me)} .side.p1 .pname{color:var(--op)}
.life{font-size:22px;font-weight:800}
.life.hit{animation:hit .6s}
@keyframes hit{0%{color:var(--op);transform:scale(1.12)}100%{color:inherit;transform:none}}
.meta{color:var(--sub);font-size:12px}
.zone-label{font-size:11px;color:var(--dim);margin:6px 0 4px}
.zone{display:flex;gap:8px;flex-wrap:wrap;min-height:60px;padding:6px;border-radius:8px;background:#0e1117}
.zone.empty::after{content:"(なし)";color:var(--dim);font-size:12px;align-self:center;padding-left:6px}

/* カード: レア度メタリック(dailies 1119-11aa で B)。星の数で枠が 銅→銀→金→虹ホロ。中は濃紺で県の形が光る */
.card{--frame:linear-gradient(135deg,#6b3e1c,#e0a96d 30%,#8c5a2b 55%,#f0c08a 80%,#6b3e1c);--metal:#e0a96d;
  position:relative;width:172px;box-sizing:border-box;border-radius:10px;padding:7px 8px 7px;color:#e8edf7;border:4px solid transparent;
  background:radial-gradient(120% 80% at 50% 0%,#1d2742,#0b1020 70%) padding-box,var(--frame) border-box;box-shadow:0 5px 14px rgba(0,0,0,.55);
  cursor:default;user-select:none;transition:transform .08s;display:flex;flex-direction:column;overflow:hidden}
.card.lv2{--frame:linear-gradient(135deg,#6f7b88,#f4f7fa 30%,#8e9aa6 55%,#ffffff 80%,#6f7b88);--metal:#dfe6ee}
.card.lv3{--frame:linear-gradient(135deg,#7a5a00,#ffe27a 30%,#b8860b 55%,#fff1b0 80%,#7a5a00);--metal:#ffd84a}
.card.lv4{--frame:conic-gradient(from 200deg,#ff5f6d,#ffc371,#f9f871,#6dffb0,#5fd3ff,#8a7dff,#ff7de9,#ff5f6d);--metal:#fff}
.card.lv4::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.2) 42%,rgba(255,255,255,0) 58%),repeating-linear-gradient(60deg,rgba(255,120,200,.06) 0 6px,rgba(120,220,255,.06) 6px 12px);pointer-events:none}
.card.pref{min-height:300px}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-3px)}
.card.selected{outline:4px solid var(--accent);outline-offset:2px}
.card.dim{opacity:.45}
.card .c-head{display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:22px}
.card .c-name{font-weight:800;font-size:15px;white-space:nowrap;color:#fff;letter-spacing:.06em;text-shadow:0 1px 0 #000}
.card .c-star{font-size:17px;line-height:1;letter-spacing:-1px;white-space:nowrap;background:var(--frame);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 3px rgba(255,255,255,.25))}
.card .c-map{position:relative;width:118px;height:118px;margin:5px auto 0;flex:none;box-sizing:border-box;border:1.5px solid var(--metal);border-radius:6px;background:radial-gradient(circle at 50% 45%,#1f3a6e,#0b1328 75%);box-shadow:0 0 10px rgba(0,0,0,.6) inset}
.card .c-map svg{display:block;width:100%;height:100%;overflow:visible}
.card .c-map path{fill:#5b8def;stroke:#bcd4ff;stroke-width:.8;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(120,170,255,.9))}
.card .c-badges{position:absolute;left:3px;top:3px;right:3px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;z-index:2}
.card .c-badges b{font-size:10px;line-height:1.3;border-radius:4px;padding:1px 5px;color:#fff;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.card .c-stack{background:#b3261e} .card .c-buff{background:#1f7a3a} .card .c-fieldfx{background:#2b6cb0}
.card.used .c-map::after{content:"攻撃済み";position:absolute;right:3px;bottom:3px;font-size:10px;background:#555;color:#fff;border-radius:4px;padding:1px 5px;z-index:2}
.card .c-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:6px;min-height:39px;align-content:flex-start}
.card .c-tags i{font-style:normal;font-size:10px;line-height:1.5;border:1px solid var(--metal);color:var(--metal);border-radius:9px;background:rgba(255,255,255,.04);padding:0 5px}
.card .c-flavor{flex:1 0 auto;font-size:10.5px;line-height:1.45;text-align:center;color:#c3cbe0;margin-top:5px;overflow:hidden}
.card .c-stats{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 4px;white-space:nowrap;background:rgba(0,0,0,.35);margin:4px -8px -7px;padding:5px 8px 6px;border-top:1px solid rgba(255,255,255,.12)}
.card .c-stats .def{margin-left:auto}
.card .c-stats span{font-size:10px;color:#9aa6c0}
.card .c-stats b{font-size:12px;font-weight:800}
.card .c-stats .atk b{color:#ff7b6b} .card .c-stats .def b{color:#7bb6ff}
.card .preview{margin-top:9px;font-size:11px;font-weight:800;border-radius:5px;padding:3px 5px;background:#222;color:#fff;position:relative;z-index:2}
.card .preview.win{background:#1f7a3a} .card .preview.lose{background:#8a2a2a} .card .preview.even{background:#666}
.card.back{width:56px;height:78px;padding:0;background:repeating-linear-gradient(45deg,#2b3550,#2b3550 6px,#334063 6px,#334063 12px);border-color:#55607a}

.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ctrl .turn{font-size:16px;font-weight:800}
.ctrl .phase{display:flex;gap:6px;margin:8px 0}
.ctrl .phase span{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:6px;background:#0e1117;color:var(--dim)}
.ctrl .phase span.on{background:var(--accent);color:#1a1a1a;font-weight:800}
.ctrl .btns{display:flex;flex-direction:column;gap:6px}
.hint{font-size:12px;color:var(--warn);min-height:1.4em;margin:6px 0}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;height:420px;overflow:auto;font-size:12px;line-height:1.55}
.log div{border-bottom:1px solid #262b36;padding:3px 0}
.log .t{color:var(--accent);font-weight:800}
.log .p0{color:var(--me)} .log .p1{color:var(--op)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 12px;font-size:18px}
.modal h3{margin:16px 0 6px;font-size:13px;color:var(--sub)}
.set-row{display:grid;grid-template-columns:1fr 240px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #262b36}
.set-row label{font-size:13px}
.set-row small{display:block;color:var(--dim);font-size:11px}
.set-row input[type=text],.set-row input[type=number]{width:100%}
.set-row .inl{display:flex;gap:6px;align-items:center}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.err{color:var(--op);font-size:12px}
.over h2{font-size:26px;text-align:center}
.tabs{display:flex;gap:4px;background:#0e1117;border-radius:10px;padding:3px;margin-right:6px}
.tabs button{border:none;background:transparent;color:var(--sub);padding:6px 14px}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset}
.pool-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters input[type=search]{width:160px}
.pool .card{padding-bottom:6px}
.pool-foot span{white-space:nowrap}
.pool-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:#9aa6c0;position:relative;z-index:2}
.pool-foot .in{color:#ff9b8f;font-weight:800}
button.mini{padding:1px 8px;font-size:13px;border-radius:6px;margin-left:3px;background:#2b3140;color:#fff}
.deck-panel{position:sticky;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 80px)}
.deck-panel .row{display:flex;gap:6px}
.deck-panel .btns{display:flex;flex-direction:column;gap:6px}
.deck-count{font-size:15px}
.deck-count b{font-size:28px;color:var(--warn)}
.deck-count.done b{color:var(--ok)}
.okmsg{color:var(--ok);font-size:12px;font-weight:700}
.lv-bars div{display:grid;grid-template-columns:52px 1fr 28px;gap:6px;align-items:center;font-size:12px}
.lv-bars span{color:var(--accent);font-size:11px}
.lv-bars i{display:block;height:9px;border-radius:4px;min-width:2px}
.lv-bars b{text-align:right}
.lvbar1{background:var(--lv1)} .lvbar2{background:var(--lv2)} .lvbar3{background:var(--lv3)} .lvbar4{background:var(--lv4)}
.deck-list{flex:1;min-height:80px;overflow:auto;background:#0e1117;border-radius:8px;padding:4px 6px}
.dl-row{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 3px 8px;border-bottom:1px solid #262b36;border-left:3px solid var(--lv1);font-size:13px}
.dl-row small{color:var(--accent)}
.dl-row.lvline2{border-left-color:var(--lv2)} .dl-row.lvline3{border-left-color:var(--lv3)} .dl-row.lvline4{border-left-color:var(--lv4)}
.card.spell{--frame:linear-gradient(135deg,#1d5e3a,#7fe0a6 30%,#2e8b57 55%,#b8f5cf 80%,#1d5e3a);--metal:#7fe0a6;min-height:300px}
.card.spell.k-field{--frame:linear-gradient(135deg,#1c4a7a,#8cc4ff 30%,#2b6cb0 55%,#c6e2ff 80%,#1c4a7a);--metal:#8cc4ff}
.card .c-kind{font-size:10px;font-weight:800;color:var(--metal);margin-top:1px}
.card .c-text{font-size:11px;line-height:1.45;margin-top:6px;color:#d6dcea}
.badge{font-size:12px;font-weight:800;background:#1f7a3a;color:#fff;border-radius:6px;padding:2px 8px}
button.interrupt{font-size:12px;padding:4px 10px;margin-left:auto}
button.interrupt.on{background:var(--accent);color:#1a1a1a}
.fieldbox{margin-top:10px;padding:8px;border-radius:8px;background:#0e1117;font-size:13px;border-left:4px solid #2b6cb0}
.fieldbox.empty{color:var(--dim);border-left-color:var(--line)}
.dl-row.spline-magic{border-left-color:#2e8b57} .dl-row.spline-field{border-left-color:#2b6cb0}
.log .spell-name{color:#7fe0a0}
.badge.off{background:#6b2a2a}
.online{max-width:640px;margin:16px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.online h2{margin:0 0 6px;font-size:18px;word-break:break-all}
.online h3{margin:16px 0 6px;font-size:13px;color:var(--sub)}
.online .row{display:flex;gap:8px;flex-wrap:wrap}
.online .row input,.online .row select{flex:1;min-width:0}
.online .seats{display:grid;gap:6px;margin-top:10px}
.online .seat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:#0e1117;border-left:4px solid var(--me)}
.online .seat.p1{border-left-color:var(--op)}
.online .rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;font-size:13px}
.online .foot{display:flex;justify-content:flex-end;margin-top:16px}
.credit{max-width:1400px;margin:0 auto;padding:0 16px 16px;color:var(--dim);font-size:11px;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a1d1d;border:1px solid var(--op);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:700}
/* ===== 対戦画面(シャドバ風の配置。dailies 1122-adbd で A) ===== */
.wrap.wide{max-width:none;padding-bottom:0}
.arena-wrap{position:relative;width:100%;overflow:hidden;border-radius:12px}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;user-select:none;
  background:radial-gradient(ellipse 70% 55% at 50% 50%,#24365e 0%,#152036 55%,#0a0f1c 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:22px 22px;pointer-events:none}
.stage .midline{position:absolute;left:300px;right:300px;top:449px;height:2px;background:linear-gradient(90deg,transparent,rgba(160,200,255,.45),transparent)}
.stage .topleft{position:absolute;left:20px;top:16px;display:flex;gap:8px;align-items:center;z-index:6}
.stage .topleft button{font-size:13px;padding:6px 12px}
.stage .topleft button.on{background:var(--accent);color:#1a1a1a}
.stage .topleft .meta{font-size:12px}
/* 場の県(小さいカード) */
.tok{--frame:linear-gradient(135deg,#6b3e1c,#e0a96d 30%,#8c5a2b 55%,#f0c08a 80%,#6b3e1c);--metal:#e0a96d;position:relative;flex:none;width:136px;height:172px;border-radius:12px;border:4px solid transparent;
  background:radial-gradient(120% 80% at 50% 0%,#1d2742,#0b1020 70%) padding-box,var(--frame) border-box;box-shadow:0 8px 18px rgba(0,0,0,.6);padding:5px 6px;transition:transform .1s,box-shadow .1s}
.tok.lv2{--frame:linear-gradient(135deg,#6f7b88,#f4f7fa 30%,#8e9aa6 55%,#ffffff 80%,#6f7b88);--metal:#dfe6ee}
.tok.lv3{--frame:linear-gradient(135deg,#7a5a00,#ffe27a 30%,#b8860b 55%,#fff1b0 80%,#7a5a00);--metal:#ffd84a}
.tok.lv4{--frame:conic-gradient(from 200deg,#ff5f6d,#ffc371,#f9f871,#6dffb0,#5fd3ff,#8a7dff,#ff7de9,#ff5f6d);--metal:#fff}
.tok .t-top{display:flex;justify-content:space-between;align-items:center;gap:2px}
.tok .t-name{font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tok .t-star{font-size:11px;letter-spacing:-1px;white-space:nowrap;background:var(--frame);-webkit-background-clip:text;background-clip:text;color:transparent}
.tok .t-map{position:relative;height:100px;margin-top:3px;border-radius:6px;background:radial-gradient(circle at 50% 45%,#1f3a6e,#0b1328 75%);border:1px solid var(--metal)}
.tok .t-map svg{width:100%;height:100%;display:block}
.tok .t-map path{fill:#5b8def;stroke:#bcd4ff;stroke-width:.8;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(120,170,255,.9))}
.tok .c-badges{position:absolute;left:3px;top:3px;right:3px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tok .c-badges b{font-size:10px;line-height:1.3;border-radius:4px;padding:1px 5px;color:#fff;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.tok .c-stack{background:#b3261e} .tok .c-buff{background:#1f7a3a} .tok .c-fieldfx{background:#2b6cb0}
.tok .t-used{position:absolute;right:3px;bottom:3px;font-size:10px;background:#555;color:#fff;border-radius:4px;padding:1px 5px}
.tok .t-atk,.tok .t-def{position:absolute;bottom:-14px;width:66px;height:30px;border-radius:8px;font-size:13px;font-weight:800;line-height:14px;text-align:center;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 6px rgba(0,0,0,.6);padding-top:1px;white-space:nowrap;letter-spacing:-.02em}
.tok .t-atk{left:-4px;background:linear-gradient(#e0533f,#8f1f14)}
.tok .t-def{right:-4px;background:linear-gradient(#3f86e0,#14438f)}
.tok .t-atk::before{content:"攻撃";display:block;font:700 9px/11px "Yu Gothic UI",sans-serif;opacity:.85}
.tok .t-def::before{content:"防御";display:block;font:700 9px/11px "Yu Gothic UI",sans-serif;opacity:.85}
.tok.clickable{cursor:pointer}
.tok.clickable:hover{transform:translateY(-4px)}
.tok.dim{opacity:.5}
.tok.used{filter:saturate(.4) brightness(.75)}
.tok.ready{box-shadow:0 0 0 3px #6fe39a,0 0 22px #6fe39a,0 8px 18px rgba(0,0,0,.6)}
.tok.selected{box-shadow:0 0 0 3px #ffcc33,0 0 26px #ffcc33,0 8px 18px rgba(0,0,0,.6);transform:translateY(-8px)}
.tok.target{cursor:crosshair}
.tok.target.hover{box-shadow:0 0 0 3px #ff6b6b,0 0 26px #ff6b6b;transform:scale(1.05)}
.tok .preview{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:3}
.tok .preview.win{background:#1f7a3a} .tok .preview.lose{background:#8a2a2a} .tok .preview.even{background:#666}
.stage .row{position:absolute;left:280px;right:280px;display:flex;justify-content:center;gap:26px}
.stage .row.tight{gap:4px}
.stage .row.opp{top:190px} .stage .row.me{top:478px}
.stage .row-empty{height:172px;display:grid;place-items:center;color:rgba(200,215,240,.35);font-size:14px}
/* リーダー(プレイヤー) */
.leader{position:absolute;display:flex;align-items:center;gap:16px;z-index:2}
.leader.opp{left:50%;transform:translateX(-50%);top:12px}
.leader.me{left:560px;transform:translateX(-50%);bottom:14px}
.portrait{position:relative;width:118px;height:118px;border-radius:50%;border:4px solid #c9d6f0;box-shadow:0 0 0 3px #3a4a6e,0 6px 18px rgba(0,0,0,.7);
  background:radial-gradient(circle at 50% 35%,#4b6fb3,#1a2850 75%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.leader.c1 .portrait{background:radial-gradient(circle at 50% 35%,#b34b4b,#501a1a 75%)}
.leader.turn .portrait{border-color:#ffcc33;box-shadow:0 0 0 3px #7a5a00,0 0 24px rgba(255,204,51,.7)}
.portrait .pn{font-size:17px;font-weight:900;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-8px}
.portrait .life{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:linear-gradient(#2c1010,#120606);border:2px solid #ff8a7a;border-radius:16px;padding:2px 12px;font-size:18px;font-weight:900;color:#ffe1dc;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.7)}
.portrait .barrier{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:800;background:#1f7a3a;color:#fff;border-radius:6px;padding:1px 7px}
.portrait .barrier.off{top:auto;bottom:-40px;background:#6b2a2a}
.portrait.target{cursor:crosshair;box-shadow:0 0 0 4px #ff6b6b,0 0 30px #ff6b6b}

<!-- ===== ルールエンジン: (状態, 操作) → 新しい状態。DOM に触らない。tools/test-engine.js から Node でも読む ===== -->
<script id="engine">
const Engine = (() => {
  'use strict';

  // ルールの数字はすべてここ。ゲームロジックは state.config だけを見る
  const DEFAULT_CONFIG = {
    startLife: 600000000000000,     // [仮] プレイヤーのライフ
    magicLimit: null,               // [確定] マジック使用上限(自分のターン開始〜次の自分のターン開始)。null = 上限なし(2026-11-23 撤廃)
    startHand: 5,                   // [仮] 最初の手札
    deckSize: 40,                   // デッキ枚数
    maxCopies: 4,                   // 同名カードの上限
    summonsPerTurn: 1,              // [仮] 1ターンの召喚回数(生け贄召喚を含む)
    stackSameName: true,            // 同じ県を召喚したら場の同名県に重ねる
    stackMultipliers: { 2: 1.5, 3: 2, 4: 2 }, // [仮] 重ねた枚数 → 攻撃力の倍率(4枚は設計書に無いので3枚と同じ値を仮置き)
    tributeTable: {                 // [確定] 星 → 必要な生け贄の組み合わせ(リリースする県の星の並び)
      1: [[]],
      2: [[1]],
      3: [[1, 1], [2]],
      4: [[1, 1, 1], [2, 2], [3]],
    },
    firstPlayerDraws: false,        // [仮] 先攻の最初のドロー
    firstTurnAttack: false,         // [確定] 先攻の1ターン目に攻撃できるか(2026-11-20 なしに決定)
    handLimit: 7,                   // [確定] 手札の上限。超える分の引いた・加えたカードは墓地へ(2026-11-20)。null = 上限なし
    fieldPerTurn: 1,                // [仮] フィールドカードを出せる枚数(自分のターンに)
    randomDeckSpells: 10,           // [仮] ランダムデッキに入れるマジック・フィールドの枚数
    // ---- [未決定] 仮の動き ----
    canAttackOnSummonTurn: true,    // 召喚したターンに攻撃できる
    reflectDamageOnLowAttack: true, // 攻撃力 < 防御力 のとき差分を攻撃側が受ける
    attackerDestroyedOnLowAttack: false, // 攻撃力 < 防御力 のとき攻撃した県が破壊される
    deckOutLoses: true,             // 山札が尽きてドローできないと負け
    // ---- 試遊用(設計書外。既定値1で設計書どおり) ----
    defenseScale: 1,                // 防御力に掛ける倍率
  };

  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  function mergeConfig(base, over) {
    const out = JSON.parse(JSON.stringify(base));
    if (!over) return out;
    for (const k of Object.keys(over)) {
      if (k === 'tributeTable' || k === 'stackMultipliers') out[k] = JSON.parse(JSON.stringify(over[k]));
      else if (isObj(over[k]) && isObj(out[k])) out[k] = mergeConfig(out[k], over[k]);
      else out[k] = over[k];
    }
    return out;
  }

  const clone = o => JSON.parse(JSON.stringify(o));
  const other = p => 1 - p;

  // 決定的な乱数(オンラインで両端末が同じ結果になるよう state に種を持つ)
  function rand(s) {
    let t = (s.rng = (s.rng + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffleInPlace(s, arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand(s) * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function makeDB(prefectures) {
    const db = {};
    for (const p of prefectures) db[p.no] = Object.assign({ kind: 'pref' }, p);
    for (const c of SPELLS) db[c.id] = c;
    return db;
  }
  const kindOf = (db, id) => (db[id] && db[id].kind) || 'pref';

  // ランダムデッキ(フェーズ3のデッキ構築までのつなぎ)
  function randomDeck(prefectures, config, seed) {
    const cfg = mergeConfig(DEFAULT_CONFIG, config);
    const s = { rng: seed | 0 };
    const nSpell = Math.min(cfg.randomDeckSpells || 0, SPELLS.length * cfg.maxCopies, cfg.deckSize);
    const pool = [], spells = [];
    for (const p of prefectures) for (let i = 0; i < cfg.maxCopies; i++) pool.push(p.no);
    for (const c of SPELLS) for (let i = 0; i < cfg.maxCopies; i++) spells.push(c.id);
    shuffleInPlace(s, pool);
    shuffleInPlace(s, spells);
    return pool.slice(0, cfg.deckSize - nSpell).concat(spells.slice(0, nSpell));
  }

  function validateDeck(deck, db, config) {
    const cfg = mergeConfig(DEFAULT_CONFIG, config);
    const errs = [];
    if (deck.length !== cfg.deckSize) errs.push(`デッキは${cfg.deckSize}枚(今は${deck.length}枚)`);
    const cnt = {};
    for (const no of deck) {
      if (!db[no]) errs.push(`存在しないカード: ${no}`);
      cnt[no] = (cnt[no] || 0) + 1;
    }
    for (const no of Object.keys(cnt)) if (cnt[no] > cfg.maxCopies) errs.push(`${db[no] ? db[no].name : no} が${cnt[no]}枚(上限${cfg.maxCopies})`);
    return errs;
  }

  // ---------- 状態の参照 ----------
  function unitNo(s, unit) { return s.cards[unit.cards[0]]; }
  function stackMultiplier(cfg, n) {
    if (n <= 1) return 1;
    if (cfg.stackMultipliers[n] != null) return Number(cfg.stackMultipliers[n]);
    const keys = Object.keys(cfg.stackMultipliers).map(Number).filter(k => k <= n).sort((a, b) => b - a);
    return keys.length ? Number(cfg.stackMultipliers[keys[0]]) : 1;
  }
  function unitStats(s, unit, db) {
    const base = db[unitNo(s, unit)];
    const n = unit.cards.length;
    const mult = s.config.stackSameName ? stackMultiplier(s.config, n) : 1;
    let bAtk = 1, bDef = 1;
    for (const b of unit.buffs || []) { bAtk *= b.atk; bDef *= b.def; }
    const f = fieldMod(s, base, db);
    return {
      no: base.no, name: base.name, level: base.level, tags: base.tags, count: n, mult,
      buffAtk: bAtk, buffDef: bDef, fieldAtk: f.atk, fieldDef: f.def, guard: unit.guardUntil >= s.turn,
      attack: Math.round(base.attack * mult * bAtk * f.atk),
      defense: Math.round(base.defense * Number(s.config.defenseScale) * bDef * f.def),
    };
  }
  function findUnit(s, p, id) { return s.players[p].field.find(u => u.id === id); }
  function fieldMod(s, pref, db) {
    if (!s.field) return { atk: 1, def: 1 };
    const def = db[s.cards[s.field.uid]];
    const m = def && def.mod ? def.mod(pref) : null;
    return { atk: m && m.atk != null ? m.atk : 1, def: m && m.def != null ? m.def : 1 };
  }
  const attacksAllowed = u => 1 + (u.extraAttacks || 0);

  // 戦闘結果の計算(実行と予告の両方で使う)
  function resolveBattle(s, attacker, target, db) {
    const a = unitStats(s, attacker, db);
    const d = unitStats(s, target, db);
    const diff = a.attack - d.defense;
    if (diff > 0) return { kind: 'win', destroyTarget: true, damageTo: 'defender', damage: diff, atk: a.attack, def: d.defense };
    if (diff < 0) return {
      kind: 'lose', destroyTarget: false,
      damageTo: s.config.reflectDamageOnLowAttack ? 'attacker' : null,
      damage: s.config.reflectDamageOnLowAttack ? -diff : 0,
      destroyAttacker: !!s.config.attackerDestroyedOnLowAttack, atk: a.attack, def: d.defense,
    };
    return { kind: 'even', destroyTarget: false, damageTo: null, damage: 0, atk: a.attack, def: d.defense };
  }

  function canAttackReason(s, p, unit) {
    if (s.phase === 'over') return '勝負はついています';
    if (s.active !== p) return '自分のターンではありません';
    if (s.phase !== 'battle') return 'バトルフェイズではありません';
    if ((unit.attacks || 0) >= attacksAllowed(unit)) return 'この県はもう攻撃しました';
    if (!s.config.canAttackOnSummonTurn && unit.summonedTurn === s.turn) return '召喚したターンは攻撃できません';
    return null;
  }

  // 手札のカードを召喚するときの生け贄の選び方(星の並び)の一覧。召喚できない理由も返す
  function summonInfo(s, p, handUid, db) {
    const pl = s.players[p];
    const no = s.cards[handUid];
    const card = db[no];
    const res = { ok: false, reason: null, combos: [], level: card ? card.level : null };
    if (s.phase === 'over') { res.reason = '勝負はついています'; return res; }
    if (s.active !== p) { res.reason = '自分のターンではありません'; return res; }
    if (s.phase !== 'main') { res.reason = '召喚はメインフェイズだけです'; return res; }
    if (!pl.hand.includes(handUid)) { res.reason = '手札にないカードです'; return res; }
    if (!card || kindOf(db, no) !== 'pref') { res.reason = '県カードではありません'; return res; }
    if (pl.summonsUsed >= s.config.summonsPerTurn) { res.reason = `このターンはもう召喚しました(1ターン${s.config.summonsPerTurn}回)`; return res; }
    const have = {};
    for (const u of pl.field) { const lv = db[unitNo(s, u)].level; have[lv] = (have[lv] || 0) + 1; }
    const combos = s.config.tributeTable[card.level] || [];
    for (const c of combos) {
      const need = {};
      for (const lv of c) need[lv] = (need[lv] || 0) + 1;
      if (Object.keys(need).every(lv => (have[lv] || 0) >= need[lv])) res.combos.push(c.slice());
    }
    if (!res.combos.length) { res.reason = `生け贄が足りません(${describeCombos(combos)})`; return res; }
    res.ok = true;
    return res;
  }
  function describeCombos(combos) {
    return combos.map(c => {
      if (!c.length) return '生け贄なし';
      const cnt = {};
      for (const lv of c) cnt[lv] = (cnt[lv] || 0) + 1;
      return Object.keys(cnt).sort().map(lv => `星${lv}を${cnt[lv]}枚`).join('+');
    }).join(' / ');
  }
  function sameMultiset(a, b) {
    if (a.length !== b.length) return false;
    const x = a.slice().sort(), y = b.slice().sort();
    return x.every((v, i) => v === y[i]);
  }

  // ---------- 変更処理(clone した state にだけ使う) ----------
  function endGame(s, winner, reason, ev) {
    if (s.phase === 'over') return;
    s.phase = 'over';
    s.winner = winner;
    s.endReason = reason;
    ev.push({ type: 'gameOver', winner, reason });
  }
  // 手札に加える。上限(handLimit)に達していたら、そのカードは手札に入らず墓地へ
  function addToHand(s, p, uid, ev, e) {
    const pl = s.players[p], lim = s.config.handLimit;
    if (lim != null && pl.hand.length >= lim) {
      pl.grave.push(uid);
      ev.push(Object.assign({}, e, { type: 'burn', via: e.type, player: p, uid, no: s.cards[uid] }));
      return false;
    }
    pl.hand.push(uid);
    ev.push(e);
    return true;
  }
  function draw(s, p, n, ev, loseOnEmpty) {
    const pl = s.players[p];
    for (let i = 0; i < n; i++) {
      if (!pl.deck.length) {
        ev.push({ type: 'deckEmpty', player: p });
        if (loseOnEmpty && s.config.deckOutLoses) endGame(s, other(p), 'deckout', ev);
        return;
      }
      const uid = pl.deck.shift();
      addToHand(s, p, uid, ev, { type: 'draw', player: p, uid, no: s.cards[uid], setup: !loseOnEmpty });
    }
  }
  function startTurn(s, ev) {
    const p = s.active;
    const pl = s.players[p];
    s.phase = 'main';
    pl.summonsUsed = 0;
    pl.magicUsed = 0; // マジック枠は自分のターン開始でリセット
    pl.magicBonus = 0;
    pl.fieldUsed = 0;
    for (const u of pl.field) { u.attacks = 0; u.extraAttacks = 0; }
    ev.push({ type: 'turnStart', turn: s.turn, player: p });
    const skipDraw = s.turn === 1 && !s.config.firstPlayerDraws;
    if (!skipDraw) draw(s, p, 1, ev, true);
  }
  function destroyUnit(s, p, unitId, ev, why) {
    const pl = s.players[p];
    const i = pl.field.findIndex(u => u.id === unitId);
    if (i < 0) return;
    const [u] = pl.field.splice(i, 1);
    pl.grave.push(...u.cards);
    ev.push({ type: 'destroyed', player: p, unitId, no: s.cards[u.cards[0]], count: u.cards.length, why });
  }
  function useBarrier(s, p, ev) {
    const pl = s.players[p];
    if (!(pl.barrier > 0)) return false;
    pl.barrier--;
    ev.push({ type: 'negated', player: p, left: pl.barrier });
    return true;
  }
  function damage(s, p, amount, ev, why) {
    if (amount <= 0) return;
    const pl = s.players[p];
    pl.life = Math.max(0, pl.life - amount);
    ev.push({ type: 'damage', player: p, amount, life: pl.life, why });
    if (pl.life <= 0) endGame(s, other(p), 'life', ev);
  }

  // 県カードを場に置く(同名がいれば重ねる)。召喚と特殊召喚で共通
  function placeCard(s, p, uid, ev, extra) {
    const pl = s.players[p];
    const no = s.cards[uid];
    const target = s.config.stackSameName ? pl.field.find(u => unitNo(s, u) === no) : null;
    if (target) {
      target.cards.push(uid);
      ev.push(Object.assign({ type: 'stack', player: p, unitId: target.id, no, count: target.cards.length }, extra));
      return target;
    }
    const unit = { id: 'u' + s.nextUnit++, cards: [uid], summonedTurn: s.turn, attacks: 0, extraAttacks: 0, buffs: [] };
    pl.field.push(unit);
    ev.push(Object.assign({ type: 'summon', player: p, unitId: unit.id, no }, extra));
    return unit;
  }
  // 手札か山札から1枚抜いて特殊召喚(手札優先)。召喚回数は使わない
  function findSource(s, p, no) {
    const pl = s.players[p];
    return pl.hand.find(u => s.cards[u] === no) || pl.deck.find(u => s.cards[u] === no) || null;
  }
  function specialSummon(s, p, uid, ev) {
    const pl = s.players[p];
    for (const zone of [pl.hand, pl.deck]) { const i = zone.indexOf(uid); if (i >= 0) { zone.splice(i, 1); break; } }
    return placeCard(s, p, uid, ev, { special: true, tributes: 0 });
  }
  const findByNo = (s, p, no) => s.players[p].field.find(u => unitNo(s, u) === no);
  function unitsWhere(s, p, db, pred) { return s.players[p].field.filter(u => pred(db[unitNo(s, u)])); }
  function addBuff(s, p, units, atk, def, source, ev) {
    for (const u of units) {
      u.buffs = u.buffs || [];
      u.buffs.push({ atk, def, source });
      ev.push({ type: 'buff', player: p, unitId: u.id, no: unitNo(s, u), atk, def, source });
    }
  }

  // ---------- マジック・フィールド ----------
  // 効果と数字はすべて [仮](設計書10章の案から。秋雨さんの調整待ち)
  // options(s, p, db) → 使えない理由(文字列) か [{label, choice}]
  const N = { 北海道: 1, 青森: 2, 岩手: 3, 宮城: 4, 福島: 7, 茨城: 8, 栃木: 9, 群馬: 10, 埼玉: 11, 千葉: 12, 東京: 13, 神奈川: 14, 新潟: 15, 富山: 16, 石川: 17, 福井: 18, 長野: 20, 愛知: 23, 大阪: 27, 鳥取: 31, 島根: 32, 広島: 34, 福岡: 40, 佐賀: 41, 熊本: 43, 鹿児島: 46, 沖縄: 47 };
  const KITAKANTO = [N.茨城, N.栃木, N.群馬];
  const SEVEN = [N.北海道, N.宮城, N.東京, N.神奈川, N.愛知, N.大阪, N.福岡];
  // 新幹線の駅がある県(東北・北陸・九州新幹線)
  const SHINKANSEN = [...new Set([
    N.東京, N.埼玉, N.栃木, N.福島, N.宮城, N.岩手, N.青森,          // 東北
    N.東京, N.埼玉, N.群馬, N.長野, N.新潟, N.富山, N.石川, N.福井, // 北陸
    N.福岡, N.佐賀, N.熊本, N.鹿児島,                             // 九州
  ])];
  const TYPHOON = [40, 41, 42, 43, 44, 45, 46, N.沖縄, N.大阪, N.千葉]; // 九州7県・沖縄・大阪・千葉
  const names = (db, nos) => nos.map(no => db[no].name.replace(/[都府県]$/, '')).join('・');
  const xLabel = v => `${v}倍`;

  // 追加マジック用の県の組
  Object.assign(N, { 秋田: 5, 岐阜: 21, 山梨: 19, 静岡: 22, 三重: 24, 滋賀: 25, 京都: 26, 兵庫: 28, 和歌山: 30, 岡山: 33, 徳島: 36, 香川: 37, 愛媛: 38, 高知: 39, 宮崎: 45 });
  const SHIKOKU = [N.徳島, N.香川, N.愛媛, N.高知];
  const SANKEI = [N.宮城, N.京都, N.広島];   // 松島・天橋立・宮島
  const MEIEN = [N.茨城, N.石川, N.岡山];    // 偕楽園・兼六園・後楽園
  const MEISEN = [N.群馬, N.岐阜, N.兵庫];   // 草津・下呂・有馬
  const MATSURI = [N.青森, N.秋田, N.宮城];  // ねぶた・竿燈・七夕
  const GYOZA = [N.栃木, N.静岡, N.宮崎];    // 宇都宮・浜松・宮崎
  const FUJI = [N.山梨, N.静岡];
  // 相手のマジックの対象にできる県(飛び地の村で守られている県を除く)
  const targets = (s, q) => s.players[q].field.filter(u => !(u.guardUntil >= s.turn));
  function heal(s, p, amount, ev) {
    const pl = s.players[p];
    pl.life += amount;
    ev.push({ type: 'heal', player: p, amount, life: pl.life });
  }
  // 場の県を持ち主の手札に戻す(重ねた分も全部。手札があふれた分は墓地)
  function bounce(s, q, unitId, ev) {
    const pl = s.players[q];
    const i = pl.field.findIndex(u => u.id === unitId);
    if (i < 0) return;
    const [u] = pl.field.splice(i, 1);
    ev.push({ type: 'bounced', player: q, unitId, no: s.cards[u.cards[0]], count: u.cards.length });
    for (const uid of u.cards) addToHand(s, q, uid, ev, { type: 'returned', player: q, uid });
  }
  // 山札にある、指定の星の県(uid)
  const deckPrefs = (s, p, db, level) => s.players[p].deck.filter(uid => kindOf(db, s.cards[uid]) === 'pref' && db[s.cards[uid]].level === level);
  // 橋・道でつながった2県: 片方がいれば、もう片方を手札か山札から特殊召喚
  function bridge(id, name, a, b, label) {
    return {
      id, kind: 'magic', name,
      text: `自分の場に${label}のどちらかがいる時、もう片方を手札か山札から特殊召喚する`,
      options(s, p, db) {
        const on = [a, b].filter(no => findByNo(s, p, no));
        if (!on.length) return `${names(db, [a, b])}のどちらかが場にいる時に使えます`;
        if (on.length === 2) return 'もう両方とも場にいます';
        const miss = on[0] === a ? b : a;
        return findSource(s, p, miss) ? [{ label: `${names(db, [miss])}を特殊召喚`, choice: 'go' }] : `${names(db, [miss])}が手札にも山札にもいません`;
      },
      resolve(s, p, choice, db, ev) {
        const miss = findByNo(s, p, a) ? b : a;
        const src = findSource(s, p, miss);
        if (src) specialSummon(s, p, src, ev);
      },
    };
  }

  const SPELLS = [
    {
      id: 'm_kitakanto', kind: 'magic', name: '北関東最弱連合軍',
      text: '自分の場に栃木・茨城・群馬のどれかがいる時、残りの県を手札か山札から特殊召喚する。3県がそろっていれば、3体をリリースして埼玉を特殊召喚する',
      options(s, p, db) {
        const on = KITAKANTO.filter(no => findByNo(s, p, no));
        if (!on.length) return '栃木・茨城・群馬のどれかが場にいる時に使えます';
        if (on.length === 3) return findSource(s, p, N.埼玉) ? [{ label: '北関東3県をリリースして埼玉を特殊召喚', choice: 'saitama' }] : '手札にも山札にも埼玉がいません';
        const miss = KITAKANTO.filter(no => !on.includes(no) && findSource(s, p, no));
        return miss.length ? [{ label: `${names(db, miss)}を特殊召喚`, choice: 'call' }] : '残りの県が手札にも山札にもいません';
      },
      resolve(s, p, choice, db, ev) {
        if (choice === 'saitama') {
          for (const no of KITAKANTO) destroyUnit(s, p, findByNo(s, p, no).id, ev, 'tribute');
          specialSummon(s, p, findSource(s, p, N.埼玉), ev);
        } else {
          for (const no of KITAKANTO) if (!findByNo(s, p, no)) { const src = findSource(s, p, no); if (src) specialSummon(s, p, src, ev); }
        }
      },
    },
    {
      id: 'm_seven', kind: 'magic', name: '七大都市そろい踏み',
      text: '北海道・宮城・東京・神奈川・愛知・大阪・福岡の7県が自分の場にそろっていたら、勝利する',
      options(s, p, db) {
        const miss = SEVEN.filter(no => !findByNo(s, p, no));
        return miss.length ? `あと ${names(db, miss)} が足りません` : [{ label: '七大都市がそろった! 勝利する', choice: 'win' }];
      },
      resolve(s, p, choice, db, ev) { endGame(s, p, 'sevenCities', ev); },
    },
    {
      id: 'm_sumitakunai', kind: 'magic', name: '住みたくない県の底力',
      text: '自分の場の栃木・茨城・群馬の3体をリリースして、山札からマジックをランダムに3枚手札に加える',
      options(s, p, db) {
        if (KITAKANTO.some(no => !findByNo(s, p, no))) return '栃木・茨城・群馬が3県とも場にいる時に使えます';
        const n = s.players[p].deck.filter(u => kindOf(db, s.cards[u]) === 'magic').length;
        return n ? [{ label: `北関東3県をリリースして、マジックを${Math.min(3, n)}枚手札に加える`, choice: 'go' }] : '山札にマジックがありません';
      },
      resolve(s, p, choice, db, ev) {
        for (const no of KITAKANTO) destroyUnit(s, p, findByNo(s, p, no).id, ev, 'tribute');
        const pl = s.players[p];
        const pool = pl.deck.filter(u => kindOf(db, s.cards[u]) === 'magic');
        shuffleInPlace(s, pool);
        for (const uid of pool.slice(0, 3)) {
          pl.deck.splice(pl.deck.indexOf(uid), 1);
          addToHand(s, p, uid, ev, { type: 'search', player: p, uid, id: s.cards[uid] });
        }
      },
    },
    {
      id: 'm_okonomi', kind: 'magic', name: 'お好み焼きブーム',
      text: '自分の場に大阪か広島がいれば、その攻撃力が2倍。両方いるなら、どちらか1体を墓地に送り、残った方の攻撃力が4倍',
      params: { one: 2, both: 4 },
      options(s, p, db) {
        const o = findByNo(s, p, N.大阪), h = findByNo(s, p, N.広島);
        if (o && h) return [
          { label: `広島を墓地に送り、大阪の攻撃力${xLabel(this.params.both)}`, choice: 'keepOsaka' },
          { label: `大阪を墓地に送り、広島の攻撃力${xLabel(this.params.both)}`, choice: 'keepHiroshima' },
        ];
        if (o || h) return [{ label: `${o ? '大阪' : '広島'}の攻撃力${xLabel(this.params.one)}`, choice: 'one' }];
        return '大阪か広島が場にいる時に使えます';
      },
      resolve(s, p, choice, db, ev) {
        const o = findByNo(s, p, N.大阪), h = findByNo(s, p, N.広島);
        if (choice === 'one') { addBuff(s, p, [o || h], this.params.one, 1, this.id, ev); return; }
        const keep = choice === 'keepOsaka' ? o : h, drop = choice === 'keepOsaka' ? h : o;
        destroyUnit(s, p, drop.id, ev, 'effect');
        addBuff(s, p, [keep], this.params.both, 1, this.id, ev);
      },
    },
    {
      id: 'm_tottori', kind: 'magic', name: '鳥取と島根どっちがどっち?',

      return [{ label: s.field ? `フィールドを「${this.name}」に上書きする` : `フィールドを「${this.name}」にする`, choice: 'set' }];
    };
  }

  // 手札のマジック・フィールドが使えるか、どう使えるか
  function castInfo(s, p, handUid, db) {
    const res = { ok: false, reason: null, options: [], kind: null };
    const pl = s.players[p];
    const def = db[s.cards[handUid]];
    if (s.phase === 'over') { res.reason = '勝負はついています'; return res; }
    if (!pl.hand.includes(handUid)) { res.reason = '手札にないカードです'; return res; }
    if (!def || !def.kind || def.kind === 'pref') { res.reason = 'マジック・フィールドではありません'; return res; }
    res.kind = def.kind;
    if (def.kind === 'magic' && s.config.magicLimit != null && pl.magicUsed >= Number(s.config.magicLimit) + (pl.magicBonus || 0)) {
      res.reason = `マジックはもう使えません(${pl.magicUsed}/${Number(s.config.magicLimit) + (pl.magicBonus || 0)}枚)`;
      return res;
    }
    const o = def.options(s, p, db);
    if (typeof o === 'string') { res.reason = o; return res; }
    res.options = o;
    res.ok = o.length > 0;
    if (!res.ok) res.reason = '使えません';
    return res;
  }
  function magicLeft(s, p) {
    if (s.config.magicLimit == null) return null;
    const pl = s.players[p];
    return Math.max(0, Number(s.config.magicLimit) + (pl.magicBonus || 0) - pl.magicUsed);
  }

  function createGame(opts) {
    const cfg = mergeConfig(DEFAULT_CONFIG, opts.config);
    const first = opts.firstPlayer === 1 ? 1 : 0;
    const s = {
      v: 1, config: cfg, rng: (opts.seed >>> 0) || 1,
      turn: 1, active: first, firstPlayer: first,
      phase: 'main', winner: null, endReason: null,
      cards: {}, nextUid: 1, nextUnit: 1, players: [], field: null,
    };
    const ev = [{ type: 'gameStart', firstPlayer: first }];
    for (let i = 0; i < 2; i++) {
      // オンライン: hiddenDecks = [枚数, 枚数]。uid の並びだけ作り、中身(cards)は各自が自分の分だけ持つ。混ぜるのも各自
      if (opts.hiddenDecks) {
        const deck = Array.from({ length: opts.hiddenDecks[i] }, (_, k) => HIDDEN_PREFIX[i] + (k + 1));
        s.players.push({ life: cfg.startLife, deck, hand: [], field: [], grave: [], summonsUsed: 0, magicUsed: 0, magicBonus: 0, fieldUsed: 0, barrier: 0 });
        continue;
      }
      const deck = opts.decks[i].map(no => { const uid = 'c' + s.nextUid++; s.cards[uid] = no; return uid; });
      if (opts.shuffle !== false) shuffleInPlace(s, deck);
      s.players.push({ life: cfg.startLife, deck, hand: [], field: [], grave: [], summonsUsed: 0, magicUsed: 0, magicBonus: 0, fieldUsed: 0, barrier: 0 });
    }
    for (let i = 0; i < 2; i++) draw(s, i, cfg.startHand, ev, false);
    startTurn(s, ev);
    return { state: s, events: ev };
  }

  const handlers = {
    summon(s, a, db, ev) {
      const p = a.player;
      const info = summonInfo(s, p, a.handUid, db);
      if (!info.ok) return info.reason;
      const pl = s.players[p];
      const ids = a.tributes || [];
      if (new Set(ids).size !== ids.length) return '同じ県を2回選んでいます';
      const units = ids.map(id => findUnit(s, p, id));
      if (units.some(u => !u)) return '生け贄に選んだ県が場にいません';
      const lvs = units.map(u => db[unitNo(s, u)].level);
      if (!info.combos.some(c => sameMultiset(c, lvs))) return `生け贄の組み合わせが違います(${describeCombos(s.config.tributeTable[info.level])})`;
      for (const id of ids) destroyUnit(s, p, id, ev, 'tribute');
      pl.hand.splice(pl.hand.indexOf(a.handUid), 1);
      placeCard(s, p, a.handUid, ev, { tributes: ids.length });
      pl.summonsUsed++;
      return null;
    },
    toBattle(s, a) {
      if (s.active !== a.player) return '自分のターンではありません';
      if (s.phase !== 'main') return 'メインフェイズではありません';
      if (s.turn === 1 && !s.config.firstTurnAttack) return '先攻の1ターン目は攻撃できません';
      s.phase = 'battle';
      return null;
    },
    attack(s, a, db, ev) {
      const p = a.player, op = other(p);
      const att = findUnit(s, p, a.attackerId);
      if (!att) return '攻撃する県が場にいません';
      const why = canAttackReason(s, p, att);
      if (why) return why;
      const opp = s.players[op];
      if (a.targetId == null) {
        if (opp.field.length) return '相手の場に県がいる間は直接攻撃できません';
        const st = unitStats(s, att, db);
        att.attacks = (att.attacks || 0) + 1;
        ev.push({ type: 'attack', player: p, attackerId: att.id, attackerNo: st.no, direct: true, atk: st.attack });
        if (useBarrier(s, op, ev)) return null;
        damage(s, op, st.attack, ev, 'direct');
        return null;
      }
      const tgt = findUnit(s, op, a.targetId);
      if (!tgt) return '攻撃先の県が見つかりません';
      const r = resolveBattle(s, att, tgt, db);
      att.attacks = (att.attacks || 0) + 1;
      ev.push({ type: 'attack', player: p, attackerId: att.id, attackerNo: unitNo(s, att), targetId: tgt.id, targetNo: unitNo(s, tgt), direct: false, atk: r.atk, def: r.def, result: r.kind });
      if (useBarrier(s, op, ev)) return null;
      if (r.destroyTarget) destroyUnit(s, op, tgt.id, ev, 'battle');
      if (r.destroyAttacker) destroyUnit(s, p, att.id, ev, 'battle');
      if (r.damageTo === 'defender') damage(s, op, r.damage, ev, 'battle');
      if (r.damageTo === 'attacker') damage(s, p, r.damage, ev, 'reflect');
      return null;
    },
    endTurn(s, a, db, ev) {
      if (s.active !== a.player) return '自分のターンではありません';
      ev.push({ type: 'turnEnd', turn: s.turn, player: s.active });
      s.active = other(s.active);
      s.turn++;
      startTurn(s, ev);
      return null;
    },
    cast(s, a, db, ev) {
      const p = a.player;
      const info = castInfo(s, p, a.handUid, db);
      if (!info.ok) return info.reason;
      const opt = a.choice == null && info.options.length === 1 ? info.options[0] : info.options.find(o => o.choice === a.choice);
      if (!opt) return '使い方を選んでください';
      const pl = s.players[p];
      const def = db[s.cards[a.handUid]];
      pl.hand.splice(pl.hand.indexOf(a.handUid), 1);
      ev.push({ type: 'cast', player: p, id: def.id, kind: def.kind, label: opt.label });
      if (def.kind === 'field') {
        if (s.field) {
          s.players[s.field.owner].grave.push(s.field.uid);
          ev.push({ type: 'fieldGone', player: s.field.owner, id: s.cards[s.field.uid] });
        }
        s.field = { uid: a.handUid, owner: p };
        pl.fieldUsed++;
      } else {
        pl.magicUsed++;
        pl.grave.push(a.handUid);
        def.resolve(s, p, opt.choice, db, ev);
      }
      return null;
    },
    concede(s, a, db, ev) {
      endGame(s, other(a.player), 'concede', ev);
      return null;
    },
  };

  // ---------- オンライン用: 隠す情報の出し入れ ----------
  // 山札・手札の uid の並びは公開。「どの uid が何のカードか」(cards)は、場・墓地・フィールドに出たものだけ公開する
  const HIDDEN_PREFIX = ['a', 'b']; // 席0 / 席1 のカードの uid の頭文字
  function hiddenUids(s) {
    const out = new Set();
    for (const pl of s.players) for (const u of pl.hand.concat(pl.deck)) out.add(u);
    return out;
  }
  // 公開してよい形にする(相手に見せる state)
  function publicState(s) {
    const hid = hiddenUids(s);
    const o = clone(s);
    o.cards = {};
    for (const u of Object.keys(s.cards)) if (!hid.has(u) && s.cards[u] != null) o.cards[u] = s.cards[u];
    return o;
  }
  // 公開 state に自分の秘密(自分のカードの中身)を足す
  function withSecret(pub, secretCards) {
    const o = clone(pub);
    o.cards = Object.assign({}, pub.cards, secretCards || {});
    return o;
  }
  // 相手に見せるイベント(引いた札・加えた札の中身を消す)
  function publicEvents(s, ev) {
    const hid = hiddenUids(s);
    return ev.map(e => {
      const o = Object.assign({}, e);
      if (o.uid && hid.has(o.uid)) { delete o.no; delete o.id; }
      return o;
    });
  }

  // 唯一の入口。元の state は変えない
  function apply(state, action, db) {
    if (state.phase === 'over' && action.type !== 'concede') return { ok: false, state, events: [], error: '勝負はついています' };
    const h = handlers[action.type];
    if (!h) return { ok: false, state, events: [], error: `知らない操作: ${action.type}` };
    if (action.player !== 0 && action.player !== 1) return { ok: false, state, events: [], error: 'player が不正です' };
    const s = clone(state);
    const ev = [];
    const err = h(s, action, db, ev);
    if (err) return { ok: false, state, events: [], error: err };
    return { ok: true, state: s, events: ev, error: null };
  }

  return {
    DEFAULT_CONFIG, mergeConfig, makeDB, randomDeck, validateDeck,
    createGame, apply, summonInfo, describeCombos, unitStats, resolveBattle, canAttackReason, findUnit,
    SPELLS, castInfo, magicLeft, attacksAllowed, kindOf,
    HIDDEN_PREFIX, hiddenUids, publicState, withSecret, publicEvents,
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;
</script>

<!-- ===== 試遊画面(一人で両方のプレイヤーを動かす) ===== -->
<script>
(() => {
'use strict';
const PREFS = JSON.parse(document.getElementById('pref-data').textContent).prefectures;
const SHAPES = JSON.parse(document.getElementById('shape-data').textContent).shapes; // 県番号 → SVG path(viewBox 0 0 100 100)
const DB = Engine.makeDB(PREFS);
const CFG_KEY = 'pref47.config.v1';
const LOCAL_NAMES = ['プレイヤー1', 'プレイヤー2'];
let PNAME = LOCAL_NAMES;
let net = null;           // オンライン対戦中の部屋(下の「オンライン対戦」)
const online = () => screen === 'online' && !!net;
// 色の番号: オンラインでは自分を青(0)・相手を赤(1)にする
const col = p => online() ? (p === net.me ? 0 : 1) : p;
const fmt = n => Math.round(n).toLocaleString('ja-JP');
// カードに出す攻撃力・防御力は「兆」単位で小数1桁(戦闘ログなどは fmt で全桁)
const cho = n => (n / 1e12).toLocaleString('ja-JP', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '兆';
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// cfgRev: 保存した設定の版。2 = マジック上限を撤廃した版(2026-11-23)。それより前に保存した設定の「2枚まで」は捨てる
const CFG_REV = 2;
function loadConfig() {
  try {
    const raw = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
    if (raw && raw.cfgRev !== CFG_REV) delete raw.magicLimit;
    return Engine.mergeConfig(Engine.DEFAULT_CONFIG, raw);
  } catch (e) { return Engine.mergeConfig(Engine.DEFAULT_CONFIG); }
}
function saveConfig(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(Object.assign({}, c, { cfgRev: CFG_REV }))); } catch (e) {} }

let config = loadConfig();
let state = null;
let logLines = [];
let ui = { mode: null, handUid: null, combos: [], tributes: [], attackerId: null };
let showAllHands = false; // [TEST] 両方の手札を表示
let modal = null;         // 'settings' | 'newgame' | null
let hitFx = [false, false];
let screen = 'play';      // 'play' | 'deck' | 'online'
// 盤面はローカル試遊とオンラインで別々に持ち、画面を切り替えたときに入れ替える
const slots = { play: null, online: { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] } };
function setScreen(to) {
  if (screen === 'play') slots.play = { state, logLines, deckNames, hitFx };
  screen = to;
  resetUI();
  const s = to === 'play' ? slots.play : to === 'online' ? slots.online : null;
  if (s) ({ state, logLines, deckNames, hitFx } = s);
  PNAME = to === 'online' && net ? net.names : LOCAL_NAMES;
}

// ---------- 端末に保存するもの ----------
const DECKS_KEY = 'pref47.decks.v1';
const SETUP_KEY = 'pref47.setup.v1';
function loadJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('この端末に保存できませんでした'); } }
let decks = loadJSON(DECKS_KEY, []).filter(d => d && Array.isArray(d.cards)); // [{id, name, cards:[県番号]}]
let setup = Object.assign({ decks: ['random', 'random'], first: '0' }, loadJSON(SETUP_KEY, {}));
let deckNames = ['ランダム', 'ランダム'];
const deckErrors = d => Engine.validateDeck(d.cards, DB, config);

function resolveDeck(choice, seed, p) {
  if (choice !== 'random') {
    const d = decks.find(x => x.id === choice);
    if (d && !deckErrors(d).length) return { cards: d.cards.slice(), name: d.name };
    toast(`${PNAME[p]} のデッキが使えないので、ランダムにしました`);
  }
  return { cards: Engine.randomDeck(PREFS, config, seed), name: 'ランダム' };
}

function newGame() {
  if (screen !== 'play') setScreen('play');
  const seed = (Math.random() * 2 ** 31) | 0;
  const d0 = resolveDeck(setup.decks[0], seed ^ 0x1234, 0);
  const d1 = resolveDeck(setup.decks[1], seed ^ 0x9876, 1);
  deckNames = [d0.name, d1.name];
  const first = setup.first === 'random' ? (seed & 1) : Number(setup.first) === 1 ? 1 : 0;
  const r = Engine.createGame({ config, decks: [d0.cards, d1.cards], seed, firstPlayer: first });
  state = r.state;
  logLines = [];
  hitFx = [false, false];
  resetUI();
  fx = null; collectFx(r.events);
  pushLog(r.events);
  render();
}
function resetUI() { ui = { mode: null, handUid: null, combos: [], tributes: [], attackerId: null, interrupt: null, choice: null }; }
const isSpell = id => Engine.kindOf(DB, id) !== 'pref';
const KIND_LABEL = { magic: 'マジック', field: 'フィールド' };

// マジック・フィールドを使う(選び方が複数あればダイアログ)
function castFlow(p, uid) {
  const info = Engine.castInfo(state, p, uid, DB);
  if (!info.ok) { toast(info.reason); return; }
  if (info.options.length === 1) { act({ type: 'cast', player: p, handUid: uid, choice: info.options[0].choice }); return; }
  ui.choice = { p, uid, options: info.options };
  modal = 'choice';
  render();
}
function choiceHTML() {
  const c = ui.choice;
  const def = DB[state.cards[c.uid]];
  return `<div class="modal-bg"><div class="modal">
    <h2>「${esc(def.name)}」をどう使う?</h2>
    <p class="meta">${esc(def.text)}</p>
    <div class="btns" style="display:flex;flex-direction:column;gap:8px">${c.options.map((o, i) => `<button class="primary" data-act="choose" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>
    <div class="foot"><button data-act="closeModal">やめる</button></div>
  </div></div>`;
}

function act(action) {
  if (online()) { netAct(action); return true; }
  const r = Engine.apply(state, action, DB);
  if (!r.ok) { toast(r.error); return false; }
  state = r.state;
  liftUid = null;
  collectFx(r.events);
  hitFx = [false, false];
  for (const e of r.events) if (e.type === 'damage') hitFx[e.player] = true;
  pushLog(r.events);
  resetUI();
  render();
  return true;
}

// ---------- ログ ----------
const nm = no => DB[no] ? DB[no].name : '?';
let pn = p => `<span class="p${col(p)}">${PNAME[p]}</span>`;
// lines: 書き込む先(オンラインの盤面を裏で更新するときに使う)
function pushLog(events, lines = logLines, names = PNAME, colorOf = col) {
  const savePn = pn;
  pn = p => `<span class="p${colorOf(p)}">${names[p]}</span>`;
  try { pushLogInner(events, lines); } finally { pn = savePn; }
}
function pushLogInner(events, logLines) {
  for (const e of events) {
    let t = null;
    switch (e.type) {
      case 'gameStart': t = `対戦開始。先攻は ${pn(e.firstPlayer)}`; break;
      case 'turnStart': t = `<span class="t">ターン${e.turn}</span> ${pn(e.player)} の番`; break;
      case 'draw': if (!e.setup) t = `${pn(e.player)} がドロー${e.no != null && e.mine ? `(${esc(nm(e.no))})` : ''}`; break;
      case 'deckEmpty': t = `${pn(e.player)} の山札が尽きた!`; break;
      case 'burn': t = `　${pn(e.player)} の手札がいっぱいなので、${e.via === 'search' ? '加えた' : '引いた'}${e.no != null ? `「${esc(nm(e.no))}」` : 'カード'}は墓地へ`; break;
      case 'summon': t = `${pn(e.player)} が <b>${nm(e.no)}</b> を${e.special ? '特殊' : ''}召喚${e.tributes ? `(生け贄${e.tributes}枚)` : ''}`; break;
      case 'stack': t = `${pn(e.player)} が <b>${nm(e.no)}</b> を${e.special ? '特殊召喚して' : ''}重ねた → ${e.count}枚重ね${e.tributes ? `(生け贄${e.tributes}枚)` : ''}`; break;
      case 'destroyed': t = e.why === 'tribute' ? `${pn(e.player)} の ${nm(e.no)} をリリース` : e.why === 'effect' ? `${pn(e.player)} の ${nm(e.no)} を墓地に送った` : `${pn(e.player)} の ${nm(e.no)} が破壊された`; break;
      case 'cast': t = `${pn(e.player)} が${KIND_LABEL[e.kind]}「<b class="spell-name">${esc(nm(e.id))}</b>」→ ${esc(e.label)}`; break;
      case 'fieldGone': t = `フィールド「${esc(nm(e.id))}」は墓地へ`; break;
      case 'buff': t = `　${nm(e.no)} の攻撃力 ×${e.atk}${e.def !== 1 ? ` / 防御力 ×${e.def}` : ''}`; break;
      case 'search': t = e.id == null ? `　${pn(e.player)} がマジックを1枚手札に加えた` : `　${pn(e.player)} が「${esc(nm(e.id))}」を手札に加えた`; break;
      case 'barrier': t = `　${pn(e.player)} は次の攻撃を無効にできる(残り${e.count}回)`; break;
      case 'negated': t = `<b>${pn(e.player)} が攻撃を無効にした!</b>`; break;
      case 'extraAttack': t = `　${nm(e.no)} はもう1回攻撃できる`; break;
      case 'heal': t = `　${pn(e.player)} のライフが <b class="num">${fmt(e.amount)}</b> 回復 → <span class="num">${fmt(e.life)}</span>`; break;
      case 'bounced': t = `　${pn(e.player)} の ${nm(e.no)} が手札に戻った${e.count > 1 ? `(${e.count}枚)` : ''}`; break;
      case 'guard': t = `　${nm(e.no)} は相手のマジックの対象にならない`; break;
      case 'luck': t = `　${e.win ? '<b>' : ''}${esc(e.text)}${e.win ? '</b>' : ''}`; break;
      case 'reset': t = `　${pn(e.player)} の場の県${e.count}枚が山札に戻った`; break;
      case 'magicBonus': t = `　${pn(e.player)} のマジック上限 +${e.plus}`; break;
      case 'attack':
        t = e.direct
          ? `${pn(e.player)} の ${nm(e.attackerNo)} が直接攻撃! 攻撃力 <span class="num">${fmt(e.atk)}</span>`
          : `${pn(e.player)} の ${nm(e.attackerNo)}(攻 <span class="num">${fmt(e.atk)}</span>)→ ${nm(e.targetNo)}(防 <span class="num">${fmt(e.def)}</span>)`;
        break;
      case 'damage': t = `${pn(e.player)} に <b class="num">${fmt(e.amount)}</b> ダメージ${e.why === 'reflect' ? '(跳ね返り)' : ''} → 残り <span class="num">${fmt(e.life)}</span>`; break;
      case 'gameOver': t = `<b>勝負あり! ${pn(e.winner)} の勝ち</b>(${({ life: 'ライフ0', deckout: '山札切れ', concede: '降参', sevenCities: '七大都市そろい踏み' })[e.reason]})`; break;
    }
    if (t) logLines.push(t);
  }
}

// ---------- 描画 ----------
function cardHTML(st, extra = {}) {
  const cls = ['card', 'pref', 'lv' + st.level];
  if (extra.clickable) cls.push('clickable');
  if (extra.selected) cls.push('selected');
  if (extra.dim) cls.push('dim');
  if (extra.used) cls.push('used');
  const badges = [
    st.count > 1 ? `<b class="c-stack">${st.count}枚重ね ×${st.mult}</b>` : '',
    st.buffAtk && (st.buffAtk !== 1 || st.buffDef !== 1) ? `<b class="c-buff">マジック 攻×${+st.buffAtk.toFixed(3)}${st.buffDef !== 1 ? ` 防×${+st.buffDef.toFixed(3)}` : ''}</b>` : '',
    st.fieldAtk && (st.fieldAtk !== 1 || st.fieldDef !== 1) ? `<b class="c-fieldfx">フィールド 攻×${st.fieldAtk}${st.fieldDef !== 1 ? ` 防×${st.fieldDef}` : ''}</b>` : '',
  ].join('');
  const flavor = DB[st.no] && DB[st.no].flavor;
  return `<div class="${cls.join(' ')}" ${extra.attrs || ''}>
    <div class="c-head"><span class="c-name">${esc(st.name)}</span><span class="c-star" title="星${st.level}">${'★'.repeat(st.level)}</span></div>
    <div class="c-map"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${SHAPES[st.no] || ''}"/></svg>${badges ? `<div class="c-badges">${badges}</div>` : ''}</div>
    <div class="c-tags">${st.tags.map(t => `<i>${esc(t)}</i>`).join('')}</div>
    <div class="c-flavor">${flavor ? esc(flavor) : ''}</div>
    <div class="c-stats"><span class="atk">攻撃力 <b>${cho(st.attack)}</b></span><span class="def">防御力 <b>${cho(st.defense)}</b></span></div>
    ${extra.preview || ''}
  </div>`;
}
function spellCardHTML(def, extra = {}) {
  const cls = ['card', 'spell', 'k-' + def.kind];
  if (extra.clickable) cls.push('clickable');
  if (extra.dim) cls.push('dim');
  return `<div class="${cls.join(' ')}" ${extra.attrs || ''}>
    <div class="c-head"><span class="c-name">${esc(def.name)}</span></div>
    <div class="c-kind">${KIND_LABEL[def.kind]}${def.kind === 'magic' ? '(速攻)' : ''}</div>
    <div class="c-text">${esc(def.text)}</div>
    ${extra.preview || ''}
  </div>`;
}
function anyCardHTML(id, extra) { return isSpell(id) ? spellCardHTML(DB[id], extra) : cardHTML(handCardStats(id), extra); }
function handCardStats(no) {
  const b = DB[no];
  return { no, name: b.name, level: b.level, tags: b.tags, count: 1, mult: 1, attack: b.attack, defense: Math.round(b.defense * Number(state.config.defenseScale)) };
}

function previewHTML(attUnit, tgtUnit) {
  const r = Engine.resolveBattle(state, attUnit, tgtUnit, DB);
  if (r.kind === 'win') return `<div class="preview win">破壊! 相手に ${cho(r.damage)}</div>`;
  if (r.kind === 'lose') return `<div class="preview lose">負け${r.damage ? ` 自分に ${cho(r.damage)}` : ''}${r.destroyAttacker ? ' 攻撃側破壊' : ''}</div>`;
  return `<div class="preview even">同じ数字: 何も起きない</div>`;
}

// ---------- 対戦画面(シャドバ風の配置。dailies 1122-adbd で A) ----------
// 1600×900 の舞台に絶対配置で並べ、画面の大きさに合わせて丸ごと拡大縮小する
let STAGE_W = 1600, STAGE_H = 900;
// スマホ(dailies 1122-a8cc で C): 小さい画面では向きで横用・縦用の舞台に切り替え、上のメニューをたたむ
let stageMode = 'desk';
const MODE_SIZE = { desk: [1600, 900], land: [1100, 520], port: [600, 1250] };
const dropY = () => stageMode === 'port' ? STAGE_H - 300 : stageMode === 'land' ? 410 : 700; // 手札をこれより上で離すと出す
function detectMode() {
  const w = window.innerWidth, h = window.innerHeight;
  if (Math.min(w, h) >= 560 && w >= 760) return 'desk';
  return w > h ? 'land' : 'port';
}
let liftUid = null;       // スマホ: 1回目のタップで持ち上げた手札
let lastPointerType = 'mouse';
let press = null, pressFired = false; // 長押しで大きく表示
// スマホ: 素早い2回タップはブラウザがダブルタップ扱いにして click を落とすので、盤面とデッキ一覧のタップは自分で click にする
let tapStart = null, touchClickUntil = 0;
const TAP_AREA = '.stage, .deckscreen .dk-grid, .deckscreen .bars';
let logOpen = false;
let fx = null;            // 次の描画で流す演出(ドロー・召喚・ダメージ・ターン開始)
let drag = null;          // ドラッグ中のカード
let suppressClick = false;

// 下に出すプレイヤー: オンラインは自分、ローカル試遊は手番の人
const bottomP = () => online() ? net.me : state.active;
// この端末で操作できる側か
const canControl = p => !online() || p === net.me;

function collectFx(events) {
  fx = fx || { draw: [], summon: [], dmg: [], banner: null };
  for (const e of events) {
    if (e.type === 'draw' && !e.setup) fx.draw.push(e.uid);
    if (e.type === 'summon' || e.type === 'stack') fx.summon.push(e.unitId);
    if (e.type === 'damage') fx.dmg.push({ p: e.player, amount: e.amount });
    if (e.type === 'turnStart') fx.banner = e.player;
  }
}

function tokBadges(st) {
  return [
    st.count > 1 ? `<b class="c-stack">${st.count}枚重ね ×${st.mult}</b>` : '',
    st.buffAtk && (st.buffAtk !== 1 || st.buffDef !== 1) ? `<b class="c-buff">マジック 攻×${+st.buffAtk.toFixed(3)}${st.buffDef !== 1 ? ` 防×${+st.buffDef.toFixed(3)}` : ''}</b>` : '',
    st.fieldAtk && (st.fieldAtk !== 1 || st.fieldDef !== 1) ? `<b class="c-fieldfx">フィールド 攻×${st.fieldAtk}${st.fieldDef !== 1 ? ` 防×${st.fieldDef}` : ''}</b>` : '',
    st.guard ? '<b class="c-buff">マジック無効</b>' : '',
  ].join('');
}
// 場の県(小さいカード: 県の形と攻撃・防御だけ)
function tokenHTML(st, ex = {}) {
  const cls = ['tok', 'lv' + st.level];
  for (const k of ['clickable', 'selected', 'dim', 'used', 'ready', 'target']) if (ex[k]) cls.push(k);
  const b = tokBadges(st);
  return `<div class="${cls.join(' ')}" ${ex.attrs || ''}>
    <div class="t-top"><span class="t-name">${esc(st.name)}</span><span class="t-star">${'★'.repeat(st.level)}</span></div>
    <div class="t-map"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${SHAPES[st.no] || ''}"/></svg>${b ? `<div class="c-badges">${b}</div>` : ''}${ex.used ? '<b class="t-used">攻撃済み</b>' : ''}</div>
    <div class="t-atk num">${cho(st.attack)}</div><div class="t-def num">${cho(st.defense)}</div>
    ${ex.preview || ''}
  </div>`;
}

function rowHTML(p) {
  const pl = state.players[p];
  const active = state.active;
  const me = active === p && state.phase !== 'over' && canControl(p);
  const toks = pl.field.map(u => {
    const st = Engine.unitStats(state, u, DB);
    const ex = { attrs: `data-unit="${u.id}" data-owner="${p}"` };
    if (me && ui.mode === 'tribute') { ex.clickable = true; ex.selected = ui.tributes.includes(u.id); }
    else if (me && state.phase === 'battle') {
      const can = !Engine.canAttackReason(state, p, u);
      const used = (u.attacks || 0) >= Engine.attacksAllowed(u);
      ex.clickable = can; ex.ready = can && ui.attackerId !== u.id; ex.used = used; ex.dim = !can && !used; ex.selected = ui.attackerId === u.id;
    }
    if (p !== active && ui.mode === 'attack' && canControl(active)) {
      ex.clickable = true; ex.target = true;
      ex.preview = previewHTML(Engine.findUnit(state, active, ui.attackerId), u);
    }
    return tokenHTML(st, ex);
  }).join('');
  return `<div class="row ${p === bottomP() ? 'me' : 'opp'} ${pl.field.length > 8 ? 'tight' : ''}">${toks || '<div class="row-empty">場に県がいません</div>'}</div>`;
}

// 手札の状態(押せる・暗い・選択中)
function handEx(p, uid, interrupting) {
  const me = state.active === p && state.phase !== 'over' && canControl(p);
  const id = state.cards[uid];
  const ex = { attrs: `data-hand="${uid}" data-owner="${p}"` };
  if (state.phase !== 'over' && isSpell(id) && (me || interrupting)) {
    const info = Engine.castInfo(state, p, uid, DB);
    ex.clickable = true; ex.dim = !info.ok; ex.ok = info.ok;
  } else if (me && state.phase === 'main' && !isSpell(id)) {
    const info = Engine.summonInfo(state, p, uid, DB);
    ex.clickable = true; ex.dim = !info.ok; ex.ok = info.ok; ex.selected = ui.handUid === uid;
  } else if (interrupting || (!me && state.phase !== 'over')) ex.dim = true;
  return ex;
}
const isInterrupting = p => online() ? (canControl(p) && state.active !== p && state.phase !== 'over') : (ui.interrupt === p && state.active !== p);

function myHandHTML(p) {
  const pl = state.players[p];
  const n = pl.hand.length;
  const inter = isInterrupting(p);
  const cards = pl.hand.map((uid, i) => {
    const off = i - (n - 1) / 2;
    const ex = handEx(p, uid, inter);
    let h = anyCardHTML(state.cards[uid], ex);
    if (ex.ok) h = h.replace('class="card ', 'class="card ok ');
    if (uid === liftUid) h = h.replace('class="card ', 'class="card lift ');
    return h.replace('class="card ', `style="--rot:${(off * 4).toFixed(1)}deg;--dy:${(off * off * 4).toFixed(1)}px" class="card `);
  }).join('');
  return `<div class="hand" data-hand-of="${p}">${cards}</div>`;
}
function topHandHTML(p) {
  const pl = state.players[p];
  const open = !online() && (ui.interrupt === p || showAllHands || state.phase === 'over');
  if (!open) return `<div class="ohand">${pl.hand.map(uid => `<i data-back="${uid}"></i>`).join('')}</div>`;
  const inter = isInterrupting(p);
  return `<div class="ohand open">${pl.hand.map(uid => anyCardHTML(state.cards[uid], handEx(p, uid, inter))).join('')}</div>`;
}

function leaderHTML(p, pos) {
  const pl = state.players[p];
  const cfg = state.config;
  const left = Engine.magicLeft(state, p);
  const summonPips = Array.from({ length: cfg.summonsPerTurn }, (_, i) => `<i class="${i < cfg.summonsPerTurn - pl.summonsUsed ? '' : 'off'}"></i>`).join('');
  const magicMax = cfg.magicLimit == null ? 0 : Math.max(cfg.magicLimit, left || 0);
  const magicPips = left == null ? '<span class="inf">∞</span>' : Array.from({ length: magicMax }, (_, i) => `<i class="${i < left ? '' : 'off'}"></i>`).join('');
  const turn = state.active === p && state.phase !== 'over';
  const directable = ui.mode === 'attack' && p !== state.active && canControl(state.active) && !pl.field.length;
  const off = online() && p !== net.me && net.presence[p] === false;
  const name = online() ? (p === net.me ? 'あなた' : esc(PNAME[p])) : esc(PNAME[p]);
  const interBtn = !online() && pos === 'opp' && state.phase !== 'over'
    ? `<button class="interrupt ${ui.interrupt === p ? 'on' : ''}" data-act="interrupt" data-p="${p}">${ui.interrupt === p ? '割り込みをやめる' : '割り込みでマジック'}</button>` : '';
  return `<div class="leader ${pos} c${col(p)} ${turn ? 'turn' : ''}">
    <div class="piles"><div class="pile deck" data-pile="${p}">山札<b>${pl.deck.length}</b></div><div class="pile grave">墓地<b>${pl.grave.length}</b></div></div>
    <div class="portrait ${directable ? 'target' : ''}" data-leader="${p}">
      <span class="pn">${name}</span>

      ${off ? '<span class="barrier off">切断中</span>' : ''}

      <div class="pips" title="このターンに召喚できる回数">召喚 ${summonPips}</div>
      <div class="pips mg" title="マジックを使える残り枚数">マジック ${magicPips}</div>
      <div>手札 ${pl.hand.length}${cfg.handLimit != null ? `/${cfg.handLimit}` : ''}</div>
      ${interBtn}
    </div>

}

function hintText() {
  if (state.phase === 'over') return '';
  if (online() && net.busy) return '送信中…';
  if (ui.mode === 'tribute') return `生け贄にする県を場から選んでください(${Engine.describeCombos(ui.combos)})`;
  if (ui.mode === 'attack') {
    const opp = state.players[1 - state.active];
    return opp.field.length ? `攻撃先の県を選んでください(${lastPointerType === 'mouse' ? '右クリック' : '「選び直す」'}でやめる)` : '相手の場は空。相手のアイコンを選ぶと直接攻撃';
  }
  if (online() && state.active !== net.me) return '相手の番です。手札のマジックは割り込みで使えます';
  if (ui.interrupt != null) return `${PNAME[ui.interrupt]} の手札からマジックを選んでください`;
  if (state.phase === 'main') return lastPointerType === 'mouse' ? '手札の県を場へドラッグ(またはクリック)で召喚' : '手札をタップで持ち上げ、もう一度タップかドラッグで出す';
  if (state.phase === 'battle') return '自分の県を相手の県へドラッグして攻撃';
  return '';
}

function rightHTML() {
  const p = state.active;
  const over = state.phase === 'over';
  const waiting = online() && p !== net.me;
  const busy = online() && net.busy ? 'disabled' : '';
  let main = '';
  if (over) {
    main = online()
      ? `<button class="primary" data-act="netRematch">もう一度(デッキを選ぶ)</button><button data-act="netLeave">部屋を出る</button>`

    main = `<div class="side-btns"><button class="primary" data-act="doSummon" ${ok ? '' : 'disabled'} ${busy}>この生け贄で召喚</button><button data-act="cancel">やめる</button></div>`;
  } else {

}

function fieldSlotHTML() {

function arenaHTML() {

  return `<div class="arena-wrap" id="arena-wrap"><div class="stage" id="stage">

    <div class="topleft">

function render() {

        <button class="${screen === 'online' ? 'on' : ''}" data-act="tabOnline">オンライン対戦</button>
      </nav>

      <button data-act="settings">設定</button>

    ${modal === 'settings' ? settingsHTML() : ''}

  if (inGame) { fitStage(); runFx(); drawArrow(); }
  else { fx = null; document.body.classList.remove('m-game', 'm-menu'); }
}

// 舞台を画面に合わせて拡大縮小
let stageK = 1;
function fitStage() {
  const wrap = document.getElementById('arena-wrap'), stage = document.getElementById('stage');
  if (!wrap || !stage) return;
  stageMode = detectMode();
  [STAGE_W, STAGE_H] = MODE_SIZE[stageMode];
  if (stageMode === 'port') STAGE_H = Math.max(1150, Math.round(600 * window.innerHeight / window.innerWidth)); // 縦長のスマホでは下(手札の上)を伸ばす
  document.body.classList.toggle('m-game', stageMode !== 'desk');
  stage.classList.toggle('m-land', stageMode === 'land');
  stage.classList.toggle('m-port', stageMode === 'port');
  stage.style.width = STAGE_W + 'px'; stage.style.height = STAGE_H + 'px';
  const arrow = document.getElementById('arrow'); if (arrow) arrow.setAttribute('viewBox', `0 0 ${STAGE_W} ${STAGE_H}`);
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const availH = stageMode === 'desk' ? Math.max(200, window.innerHeight - top - 40) : window.innerHeight - top; // デスクトップは下の出典表示のぶん空ける
  stageK = Math.max(0.3, Math.min(wrap.clientWidth / STAGE_W, availH / STAGE_H));
  stage.style.transform = `scale(${stageK})`;
  wrap.style.height = `${STAGE_H * stageK}px`;
  stage.style.left = `${Math.max(0, (wrap.clientWidth - STAGE_W * stageK) / 2)}px`;
}
window.addEventListener('resize', () => { if (document.getElementById('stage')) { fitStage(); drawArrow(); } });
// 画面の座標 → 舞台の座標
function toStage(x, y) {
  const r = document.getElementById('stage').getBoundingClientRect();
  return { x: (x - r.left) / stageK, y: (y - r.top) / stageK };
}
function rectOnStage(el) {
  const r = el.getBoundingClientRect(), a = toStage(r.left, r.top);
  return { x: a.x, y: a.y, w: r.width / stageK, h: r.height / stageK };
}

// ---------- 演出 ----------
function runFx() {
  const f = fx; fx = null;
  if (!f) return;
  const stage = document.getElementById('stage');
  const layer = document.getElementById('fxlayer');
  // ドロー: 山札から手札へ飛んでくる
  f.draw.forEach((uid, i) => {
    const el = stage.querySelector(`[data-hand="${uid}"],[data-back="${uid}"]`);
    if (!el) return;
    const owner = el.dataset.owner != null ? Number(el.dataset.owner) : 1 - bottomP();
    const pile = stage.querySelector(`[data-pile="${owner}"]`);
    if (!pile) return;
    const a = el.getBoundingClientRect(), b = pile.getBoundingClientRect();
    const k = a.width / (el.offsetWidth || 1) || 1;
    const dx = (b.left + b.width / 2 - (a.left + a.width / 2)) / k, dy = (b.top + b.height / 2 - (a.top + a.height / 2)) / k;
    el.animate([{ translate: `${dx}px ${dy}px`, scale: '0.35', opacity: 0.4 }, { translate: '0 0', scale: '1', opacity: 1 }],
      { duration: 520, delay: i * 120, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  });
  // 召喚・重ね: ドンと置かれる
  for (const id of f.summon) {
    const el = stage.querySelector(`[data-unit="${id}"]`);
    if (el) el.animate([{ scale: '1.5', opacity: 0, filter: 'brightness(2.2)' }, { scale: '0.95', opacity: 1, offset: 0.7 }, { scale: '1', filter: 'brightness(1)' }], { duration: 420, easing: 'ease-out' });
  }

  f.dmg.forEach((d, i) => {
    const pt = stage.querySelector(`[data-leader="${d.p}"]`);
    if (!pt) return;
    pt.animate([{ translate: '0 0' }, { translate: '-8px 0' }, { translate: '8px 0' }, { translate: '-5px 0' }, { translate: '0 0' }], { duration: 380, delay: i * 200 });
    const r = rectOnStage(pt);
    const n = document.createElement('div');
    n.className = 'dmgpop num';
    n.textContent = `-${cho(d.amount)}`;
    n.style.left = `${r.x + r.w / 2}px`; n.style.top = `${r.y + r.h / 2}px`;
    layer.appendChild(n);
    n.animate([{ opacity: 0, translate: '-50% 0', scale: '0.6' }, { opacity: 1, translate: '-50% -30px', scale: '1.15', offset: 0.25 }, { opacity: 0, translate: '-50% -70px', scale: '1' }],
      { duration: 1300, delay: i * 200, fill: 'both' }).onfinish = () => n.remove();
  });
  // ターン開始の帯
  if (f.banner != null && state.phase !== 'over') {
    const n = document.createElement('div');
    const mine = online() ? f.banner === net.me : true;

    layer.appendChild(n);
    n.animate([{ opacity: 0, scale: '1.3' }, { opacity: 1, scale: '1', offset: 0.18 }, { opacity: 1, offset: 0.75 }, { opacity: 0 }], { duration: 1300, fill: 'both' }).onfinish = () => n.remove();
  }
}

const REGIONS = [['北海道', 1, 1], ['東北', 2, 7], ['関東', 8, 14], ['中部', 15, 23], ['近畿', 24, 30], ['中国', 31, 35], ['四国', 36, 39], ['九州・沖縄', 40, 47]];
const regionOf = no => (REGIONS.find(r => no >= r[1] && no <= r[2]) || ['?'])[0];
const TAGS = [...new Set(PREFS.flatMap(p => p.tags))];
let editId = null;
let filt = { q: '', kind: '', region: '', level: '', tag: '', sort: 'no' };
const SPELL_IDS = Engine.SPELLS.map(c => c.id);
const cardOrder = id => typeof id === 'number' ? id : 1000 + SPELL_IDS.indexOf(id);
const sortCards = arr => arr.sort((a, b) => cardOrder(a) - cardOrder(b));
let deleteArm = false;

const curDeck = () => decks.find(d => d.id === editId) || null;
const persistDecks = () => saveJSON(DECKS_KEY, decks);
const countIn = (d, no) => d.cards.reduce((a, x) => a + (x === no ? 1 : 0), 0);
function newDeck(cards = [], name) {
  let n = decks.length + 1;
  while (decks.some(d => d.name === `デッキ${n}`)) n++;
  const d = { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name || `デッキ${n}`, cards };
  decks.push(d);
  editId = d.id;
  persistDecks();
  return d;
}
function ensureDeck() { if (!curDeck()) { if (decks.length) editId = decks[0].id; else newDeck(); } }

function filteredCards() {
  const q = filt.q.trim();
  const prefOnly = filt.region || filt.level || filt.tag;
  const prefs = (!filt.kind || filt.kind === 'pref') ? filteredPrefs().map(p => p.no) : [];
  const spells = (!filt.kind && !prefOnly) || filt.kind === 'magic' || filt.kind === 'field'
    ? Engine.SPELLS.filter(c => (!filt.kind || c.kind === filt.kind) && (!q || c.name.includes(q))).map(c => c.id) : [];
  return prefs.concat(spells);
}
function filteredPrefs() {
  const q = filt.q.trim();
  const list = PREFS.filter(p =>
    (!q || p.name.includes(q)) &&
    (!filt.region || regionOf(p.no) === filt.region) &&
    (!filt.level || p.level === Number(filt.level)) &&
    (!filt.tag || p.tags.includes(filt.tag)));
  const key = { no: p => p.no, atk: p => -p.attack, def: p => -p.defense, level: p => -p.level * 100 + p.no }[filt.sort];
  return list.sort((a, b) => key(a) - key(b));
}
function addCard(no) {
  const d = curDeck();
  if (countIn(d, no) >= config.maxCopies) { toast(`同じ県は${config.maxCopies}枚まで`); return; }
  if (d.cards.length >= config.deckSize) { toast(`デッキは${config.deckSize}枚まで`); return; }
  d.cards.push(no); sortCards(d.cards);
  persistDecks(); render();
}
function removeCard(no) {
  const d = curDeck(); const i = d.cards.indexOf(no);
  if (i < 0) return;
  d.cards.splice(i, 1); persistDecks(); render();
}
function fillDeck() {
  const d = curDeck();
  const room = [];
  for (const id of filteredCards()) for (let i = countIn(d, id); i < config.maxCopies; i++) room.push(id);
  for (let i = room.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [room[i], room[j]] = [room[j], room[i]]; }
  const need = config.deckSize - d.cards.length;
  const add = room.slice(0, need);
  d.cards.push(...add); sortCards(d.cards);
  persistDecks(); render();
  if (add.length < need) toast(`絞り込み中のカードだけでは足りず、${add.length}枚だけ入れました(あと${need - add.length}枚)`);
}

  { key: 'firstPlayerDraws', label: '先攻も最初のターンにドローする', type: 'bool' },
  { key: 'firstTurnAttack', label: '先攻も1ターン目に攻撃できる', type: 'bool' },
  { key: 'handLimit', label: '手札の上限', note: '超える分の引いたカードは墓地へ', type: 'intOrNone' },
  { h: '[未決定] 仮の動き' },

  { key: 'reflectDamageOnLowAttack', label: '攻撃力が防御力より低いとき、差分を攻撃側が受ける', type: 'bool' },
  { key: 'attackerDestroyedOnLowAttack', label: '攻撃力が防御力より低いとき、攻撃した県も破壊される', type: 'bool' },
  { key: 'deckOutLoses', label: '山札が尽きてドローできなかったら負け', type: 'bool' },

];
const getPath = (o, k) => k.split('.').reduce((a, x) => a == null ? a : a[x], o);
function setPath(o, k, v) { const ks = k.split('.'); let t = o; for (let i = 0; i < ks.length - 1; i++) t = t[ks[i]]; t[ks[ks.length - 1]] = v; }
let settingsError = '';

function settingsHTML() {
  const rows = SETTINGS.map(s => {
    if (s.h) return `<h3>${s.h}</h3>`;
    const v = getPath(config, s.key);
    let input = '';
    if (s.type === 'bool') input = `<input type="checkbox" data-set="${s.key}" ${v ? 'checked' : ''}>`;
    else if (s.type === 'intOrNone') input = `<span class="inl"><input type="text" class="num" data-set="${s.key}" value="${v == null ? '' : v}" ${v == null ? 'disabled' : ''}><label style="white-space:nowrap"><input type="checkbox" data-none="${s.key}" ${v == null ? 'checked' : ''}>上限なし</label></span>`;
    else input = `<input type="text" class="num" data-set="${s.key}" value="${s.type === 'int' ? fmt(v) : v}">`;
    return `<div class="set-row"><label>${s.label}${s.note ? `<small>${s.note}</small>` : ''}</label>${input}</div>`;
  }).join('');
  return `<div class="modal-bg"><div class="modal">
    <h2>設定(ルール調整)</h2>
    <p class="meta">${screen === 'online'
      ? 'オンライン対戦では、部屋を作った人(ホスト)の設定が使われます。ホストが保存すると、次の対戦から反映されます。'
      : '変更は「保存して新しいゲーム」で反映されます。'}この端末に保存されます。</p>
    ${rows}
    <div class="err">${esc(settingsError)}</div>
    <div class="foot">
      <button data-act="resetCfg">初期値に戻す</button>
      <span class="spacer"></span>
      <button data-act="closeSettings">閉じる</button>
      <button class="primary" data-act="saveCfg">${screen === 'online' ? '保存' : '保存して新しいゲーム'}</button>
    </div>
  </div></div>`;
}
function readSettings() {
  const c = JSON.parse(JSON.stringify(config));
  for (const s of SETTINGS) {
    if (!s.key) continue;
    const el = document.querySelector(`[data-set="${s.key}"]`);
    if (s.type === 'bool') { setPath(c, s.key, el.checked); continue; }
    if (s.type === 'intOrNone' && document.querySelector(`[data-none="${s.key}"]`).checked) { setPath(c, s.key, null); continue; }
    const raw = el.value.replace(/[,，\s]/g, '').replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    const n = Number(raw);
    if (raw === '' || !isFinite(n)) throw new Error(`「${s.label}」が数字ではありません`);
    if (s.type !== 'float' && !Number.isInteger(n)) throw new Error(`「${s.label}」は整数で入れてください`);
    if (n < 0) throw new Error(`「${s.label}」はマイナスにできません`);
    if (!Number.isSafeInteger(Math.round(n)) && s.type === 'int') throw new Error(`「${s.label}」が大きすぎます(9,007,199,254,740,991 まで)`);
    setPath(c, s.key, n);
  }
  if (c.startLife <= 0) throw new Error('ライフは1以上にしてください');
  if (c.deckSize < 1) throw new Error('デッキは1枚以上にしてください');
  if (c.maxCopies < 1) throw new Error('同名カードの上限は1以上にしてください');

}

async function roomKey(phrase) {

const normPhrase = t => String(t || '').normalize('NFKC').replace(/\s+/g, ' ').trim();

// 合言葉で入る: 部屋がなければ作る(ホスト)、1人いれば入る(ゲスト)、自分の部屋なら戻る
async function netEnter(phraseArg) {
  const phrase = normPhrase(phraseArg != null ? phraseArg : netPhrase);
  if (!phrase) { netMsg = '合言葉を入れてください'; render(); return; }
  if (phrase.length > 30) { netMsg = '合言葉は30文字までにしてください'; render(); return; }
  if (netEntering) return;
  netEntering = true; netMsg = 'つないでいます…'; render();
  try {
    const f = await fbInit();
    const D = f.D;
    const key = await roomKey(phrase);
    let seat = null;
    for (let tries = 0; tries < 2 && seat == null; tries++) {
      const meta = (await D.get(f.ref(`rooms/${key}/meta`))).val();
      try {
        if (!meta || !(meta.created > Date.now() - STALE_MS)) {
          await D.set(f.ref(`rooms/${key}`), { meta: { host: f.uid, created: D.serverTimestamp(), config: JSON.stringify(config) } });
          seat = 0;
        } else if (meta.host === f.uid) seat = 0;
        else if (meta.guest === f.uid) seat = 1;
        else if (!meta.guest) { await D.set(f.ref(`rooms/${key}/meta/guest`), f.uid); seat = 1; }
        else throw new Error('この合言葉の部屋は満員です。別の合言葉にしてください');
      } catch (e) {
        if (tries || /満員/.test(e.message)) throw /permission/i.test(e.message) ? new Error('この合言葉の部屋には入れませんでした(満員か、作り直し中です)') : e;
      }

}

function netOpen(phrase, key, seat) {

  };
  slots.online = { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] };
  if (screen === 'online') setScreen('online');
  const mine = net;
  const on = (sub, fn) => net.unsub.push(D.onValue(f.ref(roomPath(sub)),

function netClose() {
  if (!net) return;
