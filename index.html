    if (n.seat === 0) await D.remove(f.ref(`rooms/${n.key}`));
    else {
      await D.remove(f.ref(`rooms/${n.key}/ready/1`));
      await D.remove(f.ref(`rooms/${n.key}/presence/1`));
      await D.remove(f.ref(`rooms/${n.key}/meta/guest`));
    }
  } catch (e) {}
  slots.online = { state: null, logLines: [], deckNames: ['', ''], hitFx: [false, false] };
  if (screen === 'online') setScreen('online');
  netMsg = '部屋を出ました';
  overClosed = false;
  render();
}

// 自分のデッキを混ぜて秘密の場所に置き、準備OKを出す
async function netReady() {
  if (!net || !net.meta) return;
  const cfgR = roomConfig();
  const choice = setup.online || 'random';
  let cards, name;
  if (choice === 'random') { cards = Engine.randomDeck(PREFS, cfgR, cryptoInt()); name = 'ランダム'; }
  else {
    const d = decks.find(x => x.id === choice);
    if (!d) { toast('デッキが見つかりません'); return; }
    const errs = Engine.validateDeck(d.cards, DB, cfgR);
    if (errs.length) { toast('この部屋のルールでは使えません: ' + errs[0]); return; }
    cards = d.cards.slice(); name = d.name;
  }
  cryptoShuffle(cards);
  const game = nextGameNo();
  const pre = Engine.HIDDEN_PREFIX[net.me];
  const map = {};
  cards.forEach((no, i) => { map[pre + (i + 1)] = no; });
  const f = fb, D = f.D;
  try {
    await D.set(f.ref(`secrets/${net.key}/${f.uid}`), { game, cards: JSON.stringify(map) });
    await D.set(f.ref(roomPath('ready/' + net.seat)), { game, deckSize: cards.length, deckName: name.slice(0, 40) });
    net.myDeckName = name;
  } catch (e) { toast('準備OKを送れませんでした: ' + e.message); }
}
async function netUnready() {
  if (!net) return;
  try { await fb.D.remove(fb.ref(roomPath('ready/' + net.seat))); } catch (e) { toast(e.message); }
}
// ホストが設定を変えたら部屋のルールを書き換え、両者の準備OKを取り消す
async function netPushConfig() {
  if (!net) return;
  if (!isHost()) { toast('部屋のルールはホストの設定が使われます'); return; }
  const D = fb.D;
  try {
    await D.set(fb.ref(roomPath('meta/config')), JSON.stringify(config));
    await D.remove(fb.ref(roomPath('ready')));
    toast('部屋のルールを変えました。準備OKを押し直してください');
  } catch (e) { toast('ルールを送れませんでした: ' + e.message); }
}

// 両者が準備OKなら、ホストが対戦を始める(盤面は uid の並びだけ。中身は各自の秘密)
async function netMaybeStart() {
  if (!isHost() || net.starting || !net.meta) return;
  const g = nextGameNo();
  const r0 = net.ready[0], r1 = net.ready[1];
  if (!r0 || !r1 || r0.game !== g || r1.game !== g) return;
  const cfgR = roomConfig();
  if (r0.deckSize !== cfgR.deckSize || r1.deckSize !== cfgR.deckSize) return;
  net.starting = true;
  const n = net;
  try {
    const c = Engine.createGame({ config: cfgR, hiddenDecks: [r0.deckSize, r1.deckSize], seed: cryptoInt(), firstPlayer: cryptoInt() & 1 });
    const json = JSON.stringify({ state: Engine.publicState(c.state), recent: [{ ver: 1, by: 0, ev: Engine.publicEvents(c.state, c.events) }] });
    await fb.D.runTransaction(fb.ref(roomPath('pub')), cur => {
      if (cur && cur.game >= g) return; // もう始まっている
      return { game: g, ver: 1, json };
    }, { applyLocally: false });
  } catch (e) { netMsg = '対戦を始められませんでした: ' + e.message; render(); }
  n.starting = false;
}

// 公開の盤面が届いた: 自分の秘密と合わせて表示用の state を作る
async function netOnPub(v) {
  const n = net;
  n.pub = v;
  if (!v) { render(); return; }
  if (!n.secret || n.secret.game !== v.game) {
    let s = null;
    try { s = (await fb.D.get(fb.ref(`secrets/${n.key}/${fb.uid}`))).val(); } catch (e) {}
    if (net !== n || n.pub !== v) return; // 待っている間に次が届いた
    if (!s || s.game !== v.game) { netMsg = '自分のデッキの情報が見つかりません(この対戦には参加していません)'; render(); return; }
    n.secret = { game: s.game, cards: JSON.parse(s.cards) };
  }
  const data = JSON.parse(v.json);
  const slot = slots.online;
  if (n.game !== v.game) {
    n.game = v.game; n.lastVer = 0;
    slot.logLines = [];
    n.view = 'game';
    overClosed = false;
    const r = n.ready || {};
    slot.deckNames = [0, 1].map(p => p === n.me ? ((r[p] && r[p].deckName) || n.myDeckName || '') : '(非公開)');
  }
  const fresh = data.recent.filter(r => r.ver > n.lastVer);
  slot.hitFx = [false, false];
  let fromOpp = false;
  for (const r of fresh) {
    if (r.by !== n.me) fromOpp = true;
    // 自分が引いた札・加えた札は、自分のログにだけ名前を出す
    const ev = r.ev.map(e => {
      if (e.player !== n.me || !e.uid || n.secret.cards[e.uid] == null) return e;
      if (e.type === 'draw') return Object.assign({}, e, { no: n.secret.cards[e.uid], mine: true });
      if (e.type === 'search') return Object.assign({}, e, { id: n.secret.cards[e.uid] });
      if (e.type === 'burn') return Object.assign({}, e, { no: n.secret.cards[e.uid] });
      return e;
    });
    pushLog(ev, slot.logLines, n.names, p => p === n.me ? 0 : 1);
    if (n.lastVer) for (const e of ev) if (e.type === 'damage') slot.hitFx[e.player] = true;
    if (n.lastVer) collectFx(ev);
  }
  n.lastVer = v.ver;
  slot.state = Engine.withSecret(data.state, n.secret.cards);
  if (screen === 'online') {
    ({ state, logLines, deckNames, hitFx } = slot);
    if (fromOpp && ui.mode) resetUI(); // 相手の割り込みで盤面が変わったら選び直し
    if (fromOpp && modal === 'choice') { modal = null; ui.choice = null; }
  }
  render();
}

// 操作を送る。盤面の更新は transaction で1つずつ(割り込みとぶつかったらやり直し)
async function netAct(action) {
  const n = net;
  if (!n || n.busy || !n.secret) return;
  n.busy = true; resetUI(); render();
  let err = null;
  try {
    await fb.D.runTransaction(fb.ref(`rooms/${n.key}/pub`), cur => {
      err = null;
      if (cur == null) return cur;
      if (cur.game !== n.secret.game) { err = '別の対戦が始まっています'; return; }
      const data = JSON.parse(cur.json);
      const r = Engine.apply(Engine.withSecret(data.state, n.secret.cards), action, DB);
      if (!r.ok) { err = r.error; return; }
      const ver = cur.ver + 1;
      const recent = data.recent.concat([{ ver, by: n.me, ev: Engine.publicEvents(r.state, r.events) }]).slice(-RECENT_MAX);
      return { game: cur.game, ver, json: JSON.stringify({ state: Engine.publicState(r.state), recent }) };
    }, { applyLocally: false });
    if (err) toast(err);
  } catch (e) { toast('送信できませんでした: ' + e.message); }
  n.busy = false;
  render();
}

function onlineHTML() {
  const noServer = !EMU && !FIREBASE_CONFIG;
  if (!net) {
    return `<div class="online">
      <h2>オンライン対戦</h2>
      <p class="meta">相手と同じ合言葉を入れると、同じ部屋に入れます。先に入った人がホストで、ホストの設定(ルール)で対戦します。</p>
      ${noServer ? '<p class="err">オンライン対戦はまだ準備中です(サーバー未設定)。</p>' : ''}
      <div class="row"><input type="text" data-phrase maxlength="30" placeholder="合言葉(例: うどん県)" value="${esc(netPhrase)}" ${noServer ? 'disabled' : ''}>
      <button class="primary" data-act="netEnter" ${netEntering || noServer ? 'disabled' : ''}>入る</button></div>
      <div class="${/出ました/.test(netMsg) || /つないで/.test(netMsg) ? 'meta' : 'err'}" style="margin-top:8px">${esc(netMsg)}</div>
      ${EMU ? '<p class="test-tag" style="margin-top:12px">開発用: ローカルの Firebase エミュレータにつないでいます</p>' : ''}
    </div>`;
  }
  const cfgR = roomConfig();
  const g = nextGameNo();
  const opp = 1 - net.me;
  const joined = [!!(net.meta && net.meta.host), !!(net.meta && net.meta.guest)];
  const rdy = p => { const r = net.ready[p]; return !!(r && r.game === g); };
  const status = p => !joined[p] ? '<span class="meta">まだ来ていません</span>'
    : net.presence[p] === false ? '<span class="badge off">切断中</span>'
    : rdy(p) ? '<span class="badge">準備OK</span>' : '<span class="meta">デッキを選んでいます</span>';
  const myReady = rdy(net.me);
  const choice = setup.online || 'random';
  const deckOpts = `<option value="random" ${choice === 'random' ? 'selected' : ''}>ランダム(${cfgR.deckSize}枚)</option>` + decks.map(d => {
    const bad = Engine.validateDeck(d.cards, DB, cfgR).length > 0;
    return `<option value="${d.id}" ${choice === d.id ? 'selected' : ''} ${bad ? 'disabled' : ''}>${esc(d.name)}${bad ? `(使えません ${d.cards.length}/${cfgR.deckSize}枚)` : ''}</option>`;
  }).join('');
  const lastOver = net.pub && slots.online.state && slots.online.state.phase === 'over';
  const playing = net.pub && slots.online.state && slots.online.state.phase !== 'over';
  const rule = (k, v) => `<div><span class="meta">${k}</span> <b class="num">${v}</b></div>`;
  return `<div class="online">
    <h2>部屋「${esc(net.phrase)}」</h2>
    <p class="meta">相手に同じ合言葉を伝えてください。${EMU ? '<span class="test-tag" style="display:inline">エミュレータ</span>' : ''}</p>
    <div class="seats">
      <div class="seat p0"><b>あなた</b>(${net.seat === 0 ? 'ホスト' : 'ゲスト'}) ${status(net.me)}</div>
      <div class="seat p1"><b>相手</b>(${net.seat === 0 ? 'ゲスト' : 'ホスト'}) ${status(opp)}</div>
    </div>
    <h3>ルール(ホストの設定)</h3>
    <div class="rules">
      ${rule('ライフ', fmt(cfgR.startLife))}${rule('デッキ', cfgR.deckSize + '枚')}${rule('同名', cfgR.maxCopies + '枚まで')}
      ${rule('最初の手札', cfgR.startHand + '枚')}${rule('マジック', cfgR.magicLimit == null ? '上限なし' : `1ターン${cfgR.magicLimit}枚`)}${rule('召喚', `1ターン${cfgR.summonsPerTurn}回`)}${rule('手札', cfgR.handLimit == null ? '上限なし' : `${cfgR.handLimit}枚まで`)}
    </div>
    ${isHost() ? '<p class="meta">ルールは上の「設定」から変えられます。</p>' : ''}
    ${playing ? `<div class="btns" style="margin-top:12px"><button class="primary" data-act="netToGame">対戦に戻る</button></div>` : `
    <h3>デッキ</h3>
    <div class="row"><select data-netdeck ${myReady ? 'disabled' : ''}>${deckOpts}</select>
      ${myReady ? '<button data-act="netUnready">準備をやめる</button>' : `<button class="primary" data-act="netReady" ${joined[opp] ? '' : ''}>このデッキで準備OK</button>`}</div>
    <p class="meta">${myReady ? (rdy(opp) ? '対戦を始めています…' : '相手の準備を待っています') : '両方が準備OKになると対戦が始まります。先攻はランダムです。'}</p>`}
    ${lastOver ? '<div style="margin-top:8px"><button data-act="netToGame">前の対戦の盤面を見る</button></div>' : ''}
    <div class="err">${esc(netMsg)}</div>
    <div class="foot"><button class="danger" data-act="netLeave">部屋を出る</button></div>
  </div>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.phrase != null) { netPhrase = e.target.value; netEnter(); }
});

let toastTimer = null;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2200);
}

newGame();
// 再読み込みしたら、さっきの部屋に戻る
try {
  const saved = JSON.parse(sessionStorage.getItem(NET_KEY) || 'null');
  if (saved && saved.phrase) { setScreen('online'); netPhrase = saved.phrase; render(); netEnter(saved.phrase); }
} catch (e) {}
window.__game ={ get state() { return state; }, act, DB, Engine }; // [TEST] コンソールから触る用
})();
</script>
